
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08b9f1">
<title>SUPER LEARN KIDS</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body {
  width:100%;
  height:100%;
  height:100dvh;
  overflow:hidden;
  overscroll-behavior:none;
  font-family:Arial,Trebuchet MS,sans-serif;
}

body {
  background:linear-gradient(180deg,#05bafa,#c5f5ff);
  color:#084b91;
}

button {
  border:0;
  cursor:pointer;
  font-family:inherit;
}

.screen {
  width:100%;
  height:100%;
  height:100dvh;
  overflow:hidden;
  display:none;
  flex-direction:column;
  padding:9px 11px;
}

.screen.active {
  display:flex;
}

/* TOP BAR */

.topbar {
  height:43px;
  flex-shrink:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:5px;
}

.topgroup {
  display:flex;
  align-items:center;
  gap:7px;
}

.settings {
  width:38px;
  height:38px;
  border-radius:50%;
  background:white;
  font-size:19px;
  box-shadow:0 3px 0 #70a8d7;
}

.language {
  background:#0861bd;
  color:white;
  padding:9px 10px;
  border-radius:25px;
  font-weight:bold;
  font-size:12px;
}

.score {
  color:white;
  background:#0861bd;
  border-radius:25px;
  padding:9px 11px;
  font-weight:bold;
  font-size:12px;
}

.trophy {
  font-size:23px;
}

/* HOME SCREEN */

#homeScreen {
  justify-content:space-between;
}

.hero {
  text-align:center;
  flex-shrink:1;
  min-height:0;
}

.logo {
  font-size:clamp(34px,9vw,51px);
  font-weight:1000;
  line-height:.88;
  letter-spacing:-2px;
  color:white;
  text-shadow:3px 4px 0 #07529c;
}

.logo span {
  display:block;
  color:#ffdc20;
}

.tagline {
  display:inline-block;
  margin-top:9px;
  background:#8134dc;
  color:white;
  padding:8px 17px;
  border-radius:30px;
  font-size:13px;
  font-weight:bold;
  box-shadow:0 4px 0 #501ca2;
}

/* BOOK LOGO */

.book-area {
  height:clamp(110px,22vh,175px);
  margin:9px 0;
  border:4px solid white;
  border-radius:45px;
  background:linear-gradient(145deg,#67e5ff,#b7f5ff);
  box-shadow:0 0 16px #ffffff,0 5px 0 #6ab4e6;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-shrink:1;
  min-height:85px;
}

.book {
  position:relative;
  font-size:clamp(75px,19vw,125px);
  filter:drop-shadow(0 7px 4px #07529c55);
  animation:bookFloat 3s ease-in-out infinite;
}

@keyframes bookFloat {
  0%,100% {transform:translateY(0)}
  50% {transform:translateY(-7px)}
}

.welcome {
  font-size:clamp(16px,4vw,21px);
  font-weight:bold;
  margin:7px 0 11px;
}

.start {
  width:94%;
  padding:13px 5px;
  border:4px solid white;
  border-radius:45px;
  background:linear-gradient(#fff000,#ffad00);
  color:#08418d;
  font-size:clamp(19px,5vw,25px);
  font-weight:1000;
  box-shadow:0 5px 0 #d87900;
}

.start:active {
  transform:translateY(4px);
  box-shadow:0 1px 0 #d87900;
}

/* HOME BOTTOM */

.bottom-menu {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:#ffffffed;
  border-radius:19px;
  padding:9px 2px;
  flex-shrink:0;
}

.bottom-menu button {
  background:transparent;
  color:#123c80;
  font-size:10px;
  font-weight:bold;
  border-right:1px solid #bdd5ef;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}

.bottom-menu button:last-child {
  border:0;
}

.bottom-menu span {
  font-size:21px;
}

/* CATEGORY SCREEN */

#categoryScreen {
  gap:10px;
}

.page-heading {
  text-align:center;
  font-size:clamp(19px,5vw,25px);
  font-weight:1000;
  color:#07509b;
  margin:8px 0;
  flex-shrink:0;
}

.back {
  background:white;
  color:#07509b;
  padding:9px 15px;
  border-radius:25px;
  font-weight:bold;
  flex-shrink:0;
  align-self:flex-start;
}

.category-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  flex:1;
  min-height:0;
  align-content:center;
}

.category {
  border-radius:20px;
  border:3px solid white;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:90px;
  box-shadow:0 4px 0 #124d8b55;
}

.category:active {
  transform:scale(.96);
}

.category span {
  font-size:clamp(32px,9vw,47px);
}

.category strong {
  font-size:clamp(10px,3vw,14px);
  text-align:center;
}

.c1 {background:linear-gradient(145deg,#28d9ff,#0874e9)}
.c2 {background:linear-gradient(145deg,#a2f72c,#21b900)}
.c3 {background:linear-gradient(145deg,#d65bff,#8014d5)}
.c4 {background:linear-gradient(145deg,#ffb329,#f05b00)}
.c5 {background:linear-gradient(145deg,#27efc0,#00a990)}

.category-footer {
  flex-shrink:0;
  text-align:center;
  font-size:11px;
  font-weight:bold;
  padding:8px;
}

/* SHORT PHONE */

@media(max-height:650px) {
  .book-area {
    height:100px;
    min-height:75px;
    margin:5px 0;
  }

  .book {
    font-size:75px;
  }

  .tagline {
    margin-top:5px;
  }

  .welcome {
    margin:4px 0 7px;
  }

  .start {
    padding:10px;
  }

  .bottom-menu {
    padding:6px 2px;
  }

  .category-grid {
    gap:6px;
  }

  .category {
    min-height:70px;
  }
}
  
/* FIRST THREE LEARNING ICONS */

.basic-icon {
  min-height: 90px;
  border-radius: 20px;
  border: 3px solid white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 7px;
  color: white;
  box-shadow: 0 4px 0 #124d8b55;
  text-shadow: 0 3px 3px #0004;
  transition: .2s;
}

.basic-icon:active {
  transform: scale(.95);
}

.basic-icon .letters {
  font-size: clamp(27px,8vw,43px);
  font-weight: 1000;
  letter-spacing: -2px;
  line-height: 1;
}

.basic-icon strong {
  font-size: clamp(10px,3vw,14px);
  text-align: center;
}

.alphabet-icon {
  background: linear-gradient(145deg,#36caff,#0757e9);
}

.bangla-icon {
  background: linear-gradient(145deg,#ffbd42,#e66b08);
}

.number-icon {
  background: linear-gradient(145deg,#69ed50,#079b40);
}

</style>
</head>

<body>

<!-- SCREEN 1: HOME -->

<section id="homeScreen" class="screen active">

  <header class="topbar">

    <div class="topgroup">
      <button class="settings"
        onclick="showMessage('Settings coming soon!')">⚙️</button>

      <select class="language">
        <option>🌐 English</option>
        <option>🌐 বাংলা</option>
        <option>🌐 Hindi</option>
        <option>🌐 Spanish</option>
        <option>🌐 Arabic</option>
      </select>
    </div>

    <div class="topgroup">
      <div class="score">⭐ 0</div>
      <div class="trophy">🏆</div>
    </div>

  </header>

  <main class="hero">

    <div class="logo">
      SUPER
      <span>LEARN</span>
      <span>KIDS</span>
    </div>

    <div class="tagline">
      LEARN • EXPLORE • GROW
    </div>

    <!-- BOOK LOGO AREA -->

    <div class="book-area">
      <div class="book">📖</div>
    </div>

    <div class="welcome">
      Your Future Starts Here! ✨
    </div>

    <button class="start" onclick="openCategories()">
      ▶ START LEARNING
    </button>

  </main>

  <nav class="bottom-menu">

    <button onclick="showMessage('My Progress coming soon!')">
      <span>📊</span>My Progress
    </button>

    <button onclick="showMessage('Help Center coming soon!')">
      <span>❓</span>Help Center
    </button>

    <button onclick="showMessage('Rewards coming soon!')">
      <span>🎁</span>Rewards
    </button>

    <button onclick="showMessage('About SUPER LEARN KIDS')">
      <span>💗</span>About Us
    </button>

  </nav>

</section>


<!-- SCREEN 2: LEARNING CATEGORIES -->

<section id="categoryScreen" class="screen">

  <header class="topbar">

    <button class="settings"
      onclick="goHome()">🏠</button>

    <div class="score">⭐ 0</div>

    <div class="trophy">🏆</div>

  </header>

  <button class="back" onclick="goHome()">
    ← BACK TO HOME
  </button>

  <h1 class="page-heading">
    🌟 EXPLORE YOUR WORLD 🌟
  </h1>

  <div class="category-grid">
    
<!-- 1. ALPHABET LEARNING -->

<button class="basic-icon alphabet-icon"
onclick="openSubject('Alphabet Learning')">

  <span class="letters">ABC</span>
  <strong>Alphabet</strong>

</button>


<!-- 2. BANGLA ALPHABET -->

<button class="basic-icon bangla-icon"
onclick="openSubject('বাংলা বর্ণমালা')">

  <span class="letters">অ আ ক</span>
  <strong>বাংলা বর্ণমালা</strong>

</button>


<!-- 3. NUMBERS -->

<button class="basic-icon number-icon"
onclick="openSubject('Numbers')">

  <span class="letters">123</span>
  <strong>Numbers</strong>

</button>

    <button class="category c1"
      onclick="openSubject('Science')">
      <span>🧪</span>
      <strong>Science</strong>
    </button>

    <button class="category c2"
      onclick="openSubject('Technology')">
      <span>💻</span>
      <strong>Technology</strong>
    </button>

    <button class="category c3"
      onclick="openSubject('Mathematics')">
      <span>➕</span>
      <strong>Mathematics</strong>
    </button>

    <button class="category c4"
      onclick="openSubject('English')">
      <span>📖</span>
      <strong>English</strong>
    </button>

    <button class="category c5"
      onclick="openSubject('Fun Games')">
      <span>🎮</span>
      <strong>Fun Games</strong>
    </button>

  </div>

  <div class="category-footer">
    LEARN • EXPLORE • DISCOVER • CREATE
  </div>

</section>

<div id="message"
style="display:none;position:fixed;bottom:20px;left:50%;
transform:translateX(-50%);background:#08418d;color:white;
padding:12px 18px;border-radius:25px;z-index:50;
text-align:center;max-width:90%;font-size:13px;">
</div>

<script>

function openCategories() {
  document.getElementById("homeScreen").classList.remove("active");
  document.getElementById("categoryScreen").classList.add("active");
}

function goHome() {
  document.getElementById("categoryScreen").classList.remove("active");
  document.getElementById("homeScreen").classList.add("active");
}

function showMessage(text) {
  const box = document.getElementById("message");
  box.textContent = text;
  box.style.display = "block";

  clearTimeout(window.messageTimer);

  window.messageTimer = setTimeout(() => {
    box.style.display = "none";
  },2200);
}

function openSubject(name) {
  showMessage(name + " section coming soon!");
}

</script>

</body>
</html>
