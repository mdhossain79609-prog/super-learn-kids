
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER LEARN KIDS - Alphabet Test</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:"Trebuchet MS",Arial,sans-serif;
  background:linear-gradient(135deg,#37c5ff,#8b5cf6,#ff91c8);
}

.screen{
  display:none;
  width:100%;
  height:100dvh;
  padding:10px;
  overflow:hidden;
  flex-direction:column;
}

.screen.active{
  display:flex;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-shrink:0;
}

.top-btn{
  border:0;
  border-radius:16px;
  padding:9px 15px;
  background:linear-gradient(145deg,#fff,#cceaff);
  color:#1455a0;
  font-weight:900;
  font-size:14px;
  box-shadow:0 5px 0 #78a9d5;
}

.heading{
  text-align:center;
  color:white;
  font-size:clamp(23px,6vw,34px);
  font-weight:1000;
  text-shadow:2px 4px 0 #3652a8;
  margin:12px 0 3px;
}

.subtitle{
  color:white;
  text-align:center;
  font-weight:900;
  font-size:12px;
  text-shadow:1px 2px 3px #345;
}

.mode-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:13px 0;
  flex-shrink:0;
}

.mode-btn{
  border:0;
  border-radius:17px;
  padding:12px 5px;
  color:white;
  font-size:clamp(11px,3vw,15px);
  font-weight:1000;
  box-shadow:0 6px 0 #0003;
}

.learn-btn{
  background:linear-gradient(145deg,#ffca28,#ff6d00);
}

.listen-btn{
  background:linear-gradient(145deg,#c05cff,#7138d5);
}

.mode-btn.selected{
  outline:3px solid white;
  transform:translateY(-2px);
}

.letter-grid{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(7,minmax(0,1fr));
  gap:7px;
}

.letter-card{
  border:2px solid #ffffffa8;
  border-radius:15px;
  color:white;
  font-size:clamp(25px,7vw,40px);
  font-weight:1000;
  text-shadow:2px 3px 2px #3338;
  box-shadow:
    inset 0 4px 5px #ffffffa8,
    0 6px 0 #0003,
    0 9px 12px #0002;
  background:linear-gradient(145deg,#ff8baf,#e82e75);
}

.letter-card:nth-child(6n+2){
  background:linear-gradient(145deg,#64d7ff,#1676e9);
}
.letter-card:nth-child(6n+3){
  background:linear-gradient(145deg,#ffe36d,#ff8b00);
}
.letter-card:nth-child(6n+4){
  background:linear-gradient(145deg,#a8f27e,#25a94d);
}
.letter-card:nth-child(6n+5){
  background:linear-gradient(145deg,#d3a0ff,#7938d7);
}
.letter-card:nth-child(6n){
  background:linear-gradient(145deg,#ffb47b,#ed4e38);
}

.footer{
  color:white;
  text-align:center;
  font-size:11px;
  font-weight:900;
  padding:7px 0 2px;
  flex-shrink:0;
}

/* Lesson screen */

.lesson-title{
  text-align:center;
  color:white;
  font-size:20px;
  font-weight:1000;
  margin:10px 0;
  text-shadow:1px 3px 3px #345;
}

.lesson-card{
  flex:1;
  min-height:0;
  border:3px solid white;
  border-radius:22px;
  background:linear-gradient(145deg,#fff1ff,#dff6ff);
  box-shadow:0 8px 0 #5268b5;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:9px;
  padding:10px;
  overflow:hidden;
}

.image-area{
  width:100%;
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.image-area img{
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 9px 7px #3335);
}

.image-placeholder{
  width:100%;
  height:100%;
  border-radius:18px;
  background:linear-gradient(145deg,#a84aff,#6815ce);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ffe34c;
  font-size:100px;
  font-weight:1000;
  text-shadow:4px 6px 0 #48208a;
}

.lesson-word{
  color:#e84b25;
  font-size:clamp(22px,6vw,32px);
  font-weight:1000;
  text-align:center;
  text-shadow:1px 2px 0 white;
}

.bangla-word{
  color:#165dc1;
  font-size:clamp(17px,4.5vw,23px);
  font-weight:1000;
  text-align:center;
}

.rhyme{
  color:#49308a;
  font-size:clamp(15px,4vw,20px);
  font-weight:900;
  text-align:center;
  padding:8px;
  border-radius:12px;
  background:#fff;
  width:100%;
}

.voice-buttons{
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  flex-shrink:0;
}

.voice-btn{
  border:0;
  border-radius:14px;
  padding:11px 3px;
  color:white;
  font-size:clamp(10px,2.8vw,13px);
  font-weight:1000;
  box-shadow:0 5px 0 #0003;
}

.english-btn{background:linear-gradient(145deg,#28a8ff,#075bc9)}
.bangla-btn{background:linear-gradient(145deg,#42df87,#07964d)}
.all-btn{background:linear-gradient(145deg,#ffba35,#f15b08)}

.lesson-navigation{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:10px;
  flex-shrink:0;
}

.nav-btn{
  border:0;
  border-radius:13px;
  padding:10px 3px;
  background:linear-gradient(145deg,#fff,#c9e7ff);
  color:#1455a0;
  font-weight:1000;
  box-shadow:0 5px 0 #6597c2;
}

@media(max-height:650px){
  .heading{margin:5px 0 2px}
  .mode-buttons{margin:7px 0}
  .letter-grid{gap:5px}
  .lesson-title{margin:4px 0}
  .lesson-card{gap:5px;padding:6px}
  .voice-btn,.nav-btn{padding:8px 2px}
}
  
/* 3D Alphabet Lesson Text */

.lesson-word{
  font-size:clamp(27px,7vw,38px);
  font-weight:1000;
  color:#fff33b;
  -webkit-text-stroke:1px #e87516;
  text-shadow:
    1px 1px 0 #e87516,
    2px 2px 0 #d85b0b,
    3px 3px 0 #bd4200,
    4px 5px 0 #8e3100,
    6px 8px 10px #0006;
  letter-spacing:1px;
}

.bangla-word{
  font-size:clamp(20px,5vw,26px);
  font-weight:1000;
  color:#fff;
  text-shadow:
    1px 2px 0 #1455a0,
    2px 4px 0 #10417f,
    4px 6px 8px #0005;
}

.rhyme{
  font-size:clamp(16px,4.5vw,21px);
  font-weight:1000;
  color:#7134b8;
  text-shadow:1px 2px 0 #e4caff;
  border:2px solid #ffcf55;
  box-shadow:0 4px 0 #e7ad35;
}
/* Clear and Strong 3D Lesson Text */

.lesson-word{
  color:#ffea00;
  font-size:clamp(30px,7.5vw,42px);
  font-weight:1000;
  -webkit-text-stroke:1.5px #8b3000;
  text-shadow:
    1px 1px 0 #a33b00,
    2px 2px 0 #8b3000,
    3px 3px 0 #702600,
    5px 6px 0 #542000,
    7px 9px 10px #0008;
}

.bangla-word{
  color:#123d70;
  font-size:clamp(21px,5.5vw,28px);
  font-weight:1000;
  text-shadow:
    1px 1px 0 #fff,
    2px 2px 0 #b5dfff,
    3px 4px 0 #47749e,
    4px 6px 8px #0005;
}

.rhyme{
  color:#64239b;
  font-weight:1000;
  text-shadow:
    1px 1px 0 #fff,
    2px 2px 0 #e3c7ff;
}
  .lesson-image-box{
  width:100%;
  max-width:300px;
  height:190px;
  margin:8px auto;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.lesson-image-box img{
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 8px 8px #0005);
}
</style>
</head>

<body>

<section id="alphabetScreen" class="screen active">

  <div class="topbar">
    <button class="top-btn" onclick="goHome()">⌂ HOME</button>
    <div>
      <button class="top-btn">⭐</button>
      <button class="top-btn">🏆</button>
    </div>
  </div>

  <div class="heading">LEARN ALPHABET</div>
  <div class="subtitle">LET'S LEARN A TO Z!</div>

  <div class="mode-buttons">
    <button id="learnMode" class="mode-btn learn-btn selected">
      📖 LEARN LETTERS
    </button>
    <button id="listenMode" class="mode-btn listen-btn">
      🔊 LISTEN ABC
    </button>
  </div>

  <div id="letterGrid" class="letter-grid"></div>

  <div class="footer">LEARN • PLAY • GROW</div>
</section>

<section id="lessonScreen" class="screen">

  <div class="topbar">
    <button class="top-btn" onclick="backToLetters()">← ALL LETTERS</button>
    <button class="top-btn" onclick="goHome()">⌂ HOME</button>
  </div>

  <div class="lesson-title">LET'S LEARN A NEW LETTER!</div>

  <div class="lesson-card">

    <div class="image-area">
      <div id="imagePlaceholder" class="image-placeholder">A</div>
    </div>
    
<div class="lesson-image-box">
  <img
    id="lessonObjectImage"
    src="images/A-apple.png"
    alt="A for Apple"
  >
</div>
    <div id="lessonWord" class="lesson-word">A for Apple</div>
    <div id="banglaWord" class="bangla-word">এ ফর অ্যাপল</div>
    <div id="rhyme" class="rhyme">আপেল খেতে ভারি মজা।</div>

    <div class="voice-buttons">
      <button class="voice-btn english-btn">🔊 ENGLISH</button>
      <button class="voice-btn bangla-btn">🔊 বাংলা</button>
      <button class="voice-btn all-btn">▶ LISTEN ALL</button>
    </div>
  </div>

  <div class="lesson-navigation">
    <button class="nav-btn">◀ PREVIOUS</button>
    <button class="nav-btn" onclick="backToLetters()">A–Z</button>
    <button class="nav-btn">NEXT ▶</button>
  </div>
</section>

<script>
const alphabetData = [
 ["A","Apple","এ ফর অ্যাপল","আপেল খেতে ভারি মজা।"],
 ["B","Ball","বি ফর বল","বল নিয়ে খেলি চল।"],
 ["C","Cat","সি ফর ক্যাট","বিড়ালটি করে মিউ মিউ।"],
 ["D","Dog","ডি ফর ডগ","কুকুরটি দৌড়ায় রোজ।"],
 ["E","Elephant","ই ফর এলিফ্যান্ট","হাতিটি অনেক বড়।"],
 ["F","Fish","এফ ফর ফিশ","মাছটি সাঁতার কাটে।"],
 ["G","Grapes","জি ফর গ্রেপস","আঙুর খেতে মজা।"],
 ["H","House","এইচ ফর হাউস","এটি আমাদের ঘর।"],
 ["I","Ice Cream","আই ফর আইসক্রিম","ঠান্ডা ঠান্ডা মজা।"],
 ["J","Juice","জে ফর জুস","ফলের রসে পুষ্টি।"],
 ["K","Kite","কে ফর কাইট","ঘুড়ি ওড়ে আকাশে।"],
 ["L","Lion","এল ফর লায়ন","সিংহ বনের রাজা।"],
 ["M","Monkey","এম ফর মাঙ্কি","বানরটি লাফায়।"],
 ["N","Nest","এন ফর নেস্ট","পাখির ছোট্ট বাসা।"],
 ["O","Orange","ও ফর অরেঞ্জ","কমলা খেতে মজা।"],
 ["P","Panda","পি ফর পান্ডা","পান্ডা দেখতে মিষ্টি।"],
 ["Q","Queen","কিউ ফর কুইন","রানি থাকেন প্রাসাদে।"],
 ["R","Rabbit","আর ফর র‍্যাবিট","খরগোশ লাফায়।"],
 ["S","Sun","এস ফর সান","সূর্য আলো দেয়।"],
 ["T","Tiger","টি ফর টাইগার","বাঘটি দেখতে সুন্দর।"],
 ["U","Umbrella","ইউ ফর আমব্রেলা","বৃষ্টি থেকে বাঁচায়।"],
 ["V","Van","ভি ফর ভ্যান","ভ্যানে চড়ে যাই।"],
 ["W","Watch","ডাবলিউ ফর ওয়াচ","সময় জানায়।"],
 ["X","Xylophone","এক্স ফর জাইলোফোন","বাজে মিষ্টি সুর।"],
 ["Y","Yo-yo","ওয়াই ফর ইয়ো ইয়ো","খেলতে লাগে ভালো।"],
 ["Z","Zebra","জেড ফর জেব্রা","গায়ে সাদা কালো দাগ।"]
];

let selectedMode = "learn";
let selectedIndex = 0;

const grid = document.getElementById("letterGrid");

function createLetters(){
 grid.innerHTML = "";

 alphabetData.forEach((item,index)=>{
  const card = document.createElement("button");
  card.className = "letter-card";
  card.textContent = item[0];

  card.onclick = ()=>openLetter(index);

  grid.appendChild(card);
 });
}

function selectMode(mode){
 selectedMode = mode;

 document.getElementById("learnMode")
 .classList.toggle("selected",mode==="learn");

 document.getElementById("listenMode")
 .classList.toggle("selected",mode==="listen");
}

document.getElementById("learnMode").onclick =
 ()=>selectMode("learn");

document.getElementById("listenMode").onclick =
 ()=>selectMode("listen");

function openLetter(index){
 selectedIndex = index;

 if(selectedMode==="listen"){
  // এই মোডে একই স্ক্রিনে থাকবে।
  // MP3 কণ্ঠ পরের ধাপে যুক্ত হবে।
  return;
 }

 const item = alphabetData[index];

 document.getElementById("imagePlaceholder").textContent = item[0];
 document.getElementById("lessonWord").textContent =
  item[0]+" for "+item[1];

 document.getElementById("banglaWord").textContent = item[2];
 document.getElementById("rhyme").textContent = item[3];

 showScreen("lessonScreen");
}

function showScreen(id){
 document.querySelectorAll(".screen").forEach(screen=>{
  screen.classList.remove("active");
 });

 document.getElementById(id).classList.add("active");
}

function backToLetters(){
 showScreen("alphabetScreen");
}

function goHome(){
 window.location.href = "index.html";
}

function previousLetter(){
 selectedIndex = (selectedIndex+25)%26;
 selectMode("learn");
 openLetter(selectedIndex);
}

function nextLetter(){
 selectedIndex = (selectedIndex+1)%26;
 selectMode("learn");
 openLetter(selectedIndex);
}

const navButtons = document.querySelectorAll(".nav-btn");

navButtons[0].onclick = previousLetter;
navButtons[2].onclick = nextLetter;

document.querySelectorAll(".voice-btn").forEach(button=>{
 button.onclick = ()=>{
  // MP3 কণ্ঠ পরের ধাপে যুক্ত হবে।
 };
});

createLetters();
selectMode("learn");
</script>

</body>
</html>
