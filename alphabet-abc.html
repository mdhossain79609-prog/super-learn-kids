<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#071b46">
<title>SUPER LEARN KIDS - Alphabet</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
 width:100%;height:100%;overflow:hidden;
 font-family:Arial,"Noto Sans Bengali",sans-serif;
 background:#071b46;color:#fff;
}
body{
 height:100vh;height:100dvh;
 background:
 radial-gradient(circle at 15% 15%,#2455a5 0,transparent 32%),
 radial-gradient(circle at 90% 85%,#522b99 0,transparent 34%),
 linear-gradient(145deg,#06132f,#102c62 55%,#170e45);
}
.app{
 width:100%;height:100%;
 display:flex;flex-direction:column;
 padding:5px 9px 8px;gap:7px;
 overflow:hidden;
}
.brand{
 flex:0 0 25px;
 display:flex;align-items:center;justify-content:center;
 font-weight:1000;font-size:clamp(13px,3.8vw,19px);
 letter-spacing:2px;color:#fff;
 text-shadow:0 2px 0 #243d85,0 4px 8px #000;
}
.brand span{color:#ffd84c;margin:0 4px}
.monitor{
 flex:0 0 35%;
 min-height:130px;max-height:270px;
 width:100%;position:relative;overflow:hidden;
 border:7px solid #a9b5c9;border-radius:18px;
 background:linear-gradient(145deg,#101827,#020713);
 box-shadow:
 inset 0 0 0 3px #4d5e7b,
 inset 0 0 25px #000,
 0 7px 0 #52647f,0 12px 18px #0009;
 display:flex;align-items:center;justify-content:center;
}
.screen{
 width:100%;height:100%;padding:7px;
 display:flex;align-items:center;justify-content:center;
 gap:10px;position:relative;
 background:
 radial-gradient(circle at 50% 40%,#263b60 0,#111e39 55%,#070d1b 100%);
}
.big-letter{
 flex:1;min-width:0;
 display:flex;align-items:center;justify-content:center;
 font-size:clamp(90px,25vw,190px);
 line-height:1;font-weight:1000;
 color:#ffe34e;
 text-shadow:
 0 3px 0 #bd7d00,0 6px 0 #936000,
 0 10px 0 #583900,0 14px 15px #000;
 overflow:hidden;
}
.picture-panel{
 flex:1;min-width:0;height:100%;
 display:none;flex-direction:column;
 align-items:center;justify-content:center;
 text-align:center;gap:4px;
 border-left:2px solid #647a9c;
 padding:3px;
}
.picture-panel.show{display:flex}
.picture{
 font-size:clamp(42px,13vw,90px);
 filter:drop-shadow(0 5px 3px #0008);
 line-height:1.1;
}
.word{
 font-size:clamp(12px,3.5vw,20px);
 font-weight:900;color:#fff;
 overflow-wrap:anywhere;
}
.line{
 font-size:clamp(10px,2.7vw,14px);
 color:#cdeaff;line-height:1.25;
 overflow-wrap:anywhere;
}
.controls{
 flex:0 0 auto;
 display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
 gap:6px;
}
.control{
 min-width:0;height:clamp(43px,10vw,57px);
 border:0;border-radius:12px;
 color:#fff;font-weight:1000;
 font-size:clamp(10px,2.8vw,14px);
 text-shadow:0 2px 2px #0008;
 box-shadow:inset 0 3px 1px #ffffff70,
 inset 0 -4px 1px #0003,
 0 5px 0 #0005,0 7px 8px #0007;
 cursor:pointer;
}
.control:active{transform:translateY(4px);box-shadow:inset 0 2px 4px #0005}
.back{background:linear-gradient(#ff9d35,#e64b14)}
.case{background:linear-gradient(#26d7ff,#0874c8)}
.sound{background:linear-gradient(#44e58a,#078d54)}
.sound.off{background:linear-gradient(#7e8b9e,#3e4a5d)}
.picture-btn{background:linear-gradient(#ff71d1,#b52a9b)}
.picture-btn.active{background:linear-gradient(#ffdf55,#ed8b00);color:#351b00}
.language{background:linear-gradient(#a88bff,#5931c5)}
.grid-wrap{
 flex:1 1 auto;min-height:0;
 width:100%;overflow:hidden;
 border:3px solid #8f78ff;border-radius:15px;
 background:linear-gradient(145deg,#47258e,#20135d);
 box-shadow:inset 0 4px 12px #0006,0 5px 12px #0007;
 padding:7px;
}
.letters{
 width:100%;height:100%;
 overflow-y:auto;overscroll-behavior:contain;
 display:grid;
 grid-template-columns:repeat(6,minmax(0,1fr));
 grid-auto-rows:minmax(43px,auto);
 align-content:start;gap:7px;
 padding:2px 3px 12px;
 scrollbar-width:thin;
 scrollbar-color:#ffd34f #38216e;
}
.letter{
 min-width:0;min-height:43px;
 border:2px solid #9bdcff;border-radius:11px;
 background:linear-gradient(145deg,#50caff,#0872d4);
 color:#fff;font-size:clamp(19px,5.5vw,29px);
 font-weight:1000;
 text-shadow:0 2px 2px #00406e;
 box-shadow:inset 0 3px 1px #ffffff8a,
 inset 0 -3px 2px #003b8b66,
 0 4px 0 #06448b,0 6px 7px #0007;
 cursor:pointer;
 display:flex;align-items:center;justify-content:center;
}
.letter.selected{
 background:linear-gradient(145deg,#fff27a,#ff9e18);
 color:#7a2800;border-color:#fff;
 text-shadow:0 1px #fff;
 box-shadow:inset 0 3px 2px #fff,
 0 4px 0 #9d4300,0 0 12px #ffe85b;
 transform:translateY(-2px);
}
.letters.rtl{direction:rtl}
.popup{
 position:fixed;inset:0;z-index:20;
 background:#0009;display:none;
 align-items:center;justify-content:center;padding:20px;
}
.popup.open{display:flex}
.language-box{
 width:min(420px,100%);
 max-height:75%;
 overflow:auto;
 background:linear-gradient(145deg,#243e83,#17134f);
 border:3px solid #9e8aff;border-radius:18px;
 padding:14px;box-shadow:0 12px 35px #000b;
}
.language-title{
 text-align:center;font-weight:1000;font-size:18px;
 margin-bottom:12px;color:#ffe36b;
}
.language-list{
 display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.lang-option{
 padding:12px 7px;border:2px solid #8abfff;
 border-radius:11px;background:linear-gradient(#4c9bff,#2054b8);
 color:#fff;font-weight:900;font-size:14px;
}
.lang-option.current{background:linear-gradient(#ffe56c,#f18a14);color:#482100}
.close{
 width:100%;margin-top:12px;padding:11px;
 border:0;border-radius:10px;
 background:#e84b5c;color:#fff;font-weight:900;
}
@media(min-width:700px){
 .app{max-width:900px;margin:auto;padding:8px 18px 12px;gap:10px}
 .brand{flex-basis:32px}
 .monitor{flex-basis:38%;max-height:340px}
 .controls{gap:10px}
 .control{height:58px;font-size:16px}
 .letters{grid-template-columns:repeat(9,minmax(0,1fr));gap:10px}
 .letter{min-height:55px;font-size:32px}
}
@media(max-height:600px){
 .app{gap:5px;padding-top:3px;padding-bottom:4px}
 .brand{flex-basis:20px;font-size:13px}
 .monitor{flex-basis:31%;min-height:105px}
 .control{height:39px}
 .grid-wrap{padding:5px}
 .letters{gap:5px;grid-auto-rows:minmax(36px,auto)}
 .letter{min-height:36px}
}

@media(min-width:700px){

}

@media(max-height:600px){

}

const languageKeys=Object.keys(languages);
let currentLanguage="en";
let currentIndex=0;
let pictureOn=false;
let soundOn=true;
let lowerCase=false;

const bigLetter=document.getElementById("bigLetter");
const lettersBox=document.getElementById("letters");
const picturePanel=document.getElementById("picturePanel");
const pictureEl=document.getElementById("picture");
const wordEl=document.getElementById("word");
const lineEl=document.getElementById("line");
const soundBtn=document.getElementById("soundBtn");
const pictureBtn=document.getElementById("pictureBtn");
const popup=document.getElementById("languagePopup");

function getData(){return languages[currentLanguage]}
function currentChar(){return getData().letters[currentIndex]}

function getExample(ch){
 const data=getData();
 const key=ch.toUpperCase();
 const example=data.examples[key]||data.examples[ch]||null;
 if(example)return example;
 return ["🌟",ch, ch];
}

function render(){
 const data=getData();
 const ch=currentChar();
 const shown=(lowerCase && /^[A-Z]$/.test(ch))?ch.toLowerCase():ch;

 bigLetter.textContent=shown;
 document.documentElement.lang=currentLanguage;
 lettersBox.classList.toggle("rtl",data.dir==="rtl");

 const ex=getExample(ch);
 const emojiCode=Array.from(ex[0])
 .map(ch=>ch.codePointAt(0).toString(16))
 .filter(code=>code!=="fe0f")
 .join("-");

pictureEl.innerHTML=
 `<img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/${emojiCode}.svg"
 alt="${ex[1]}"
 onerror="this.style.display='none';this.parentElement.textContent='${ex[0]}'">`;

wordEl.textContent=ex[1];
 lineEl.textContent=ex[2];

 picturePanel.classList.toggle("show",pictureOn);
 pictureBtn.classList.toggle("active",pictureOn);
 soundBtn.classList.toggle("off",!soundOn);
 soundBtn.textContent=soundOn?"🔊 Sound ON":"🔇 Sound OFF";

 lettersBox.innerHTML="";
 data.letters.forEach((letter,index)=>{
  const button=document.createElement("button");
  button.className="letter"+(index===currentIndex?" selected":"");
  button.type="button";
  button.textContent=(lowerCase && /^[A-Z]$/.test(letter))?letter.toLowerCase():letter;
  button.addEventListener("click",()=>{
   currentIndex=index;
   render();
   if(soundOn)speakCurrent();
  });
  lettersBox.appendChild(button);
 });
 const selected=lettersBox.children[currentIndex];
 if(selected)selected.scrollIntoView({block:"nearest",inline:"nearest"});
}


function speak(text){
 if(!("speechSynthesis" in window)){
  alert("এই ব্রাউজারে Text to Speech সুবিধা পাওয়া যাচ্ছে না।");
  return;
 }

 const synth=window.speechSynthesis;
 synth.cancel();

 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang=getData().locale;
 utterance.rate=0.82;
 utterance.pitch=1.08;
 utterance.volume=1;

 const voices=synth.getVoices();
 const languageCode=getData().locale.toLowerCase();

 const matchingVoice=voices.find(v=>
  v.lang.toLowerCase()===languageCode
 );

 const similarVoice=voices.find(v=>
  v.lang.toLowerCase().startsWith(languageCode.split("-")[0])
 );

 if(matchingVoice){
  utterance.voice=matchingVoice;
 }else if(similarVoice){
  utterance.voice=similarVoice;
 }

 synth.resume();
 synth.speak(utterance);
}

function speakCurrent(){
 const ch=currentChar();
 const ex=getExample(ch);

 if(pictureOn){
  speak(ch+". "+ex[1]+". "+ex[2]);
 }else{
  speak(ch);
 }
}


document.getElementById("backBtn").addEventListener("click",()=>{
 currentIndex=(currentIndex-1+getData().letters.length)%getData().letters.length;
 render();
 if(soundOn)speakCurrent();
});

document.getElementById("caseBtn").addEventListener("click",()=>{
 lowerCase=!lowerCase;
 render();
});

soundBtn.addEventListener("click",()=>{
 soundOn=true;
 render();
 speakCurrent();
});

pictureBtn.addEventListener("click",()=>{
 pictureOn=!pictureOn;
 render();
 if(soundOn && pictureOn)speakCurrent();
});

document.getElementById("languageBtn").addEventListener("click",()=>{
 popup.classList.add("open");
});

document.getElementById("closePopup").addEventListener("click",()=>{
 popup.classList.remove("open");
});

popup.addEventListener("click",event=>{
 if(event.target===popup)popup.classList.remove("open");
});

function buildLanguageButtons(){
 const list=document.getElementById("languageList");
 list.innerHTML="";
 languageKeys.forEach(key=>{
  const button=document.createElement("button");
  button.className="lang-option"+(key===currentLanguage?" current":"");
  button.textContent=languages[key].name;
  button.addEventListener("click",()=>{
   currentLanguage=key;
   currentIndex=0;
   lowerCase=false;
   popup.classList.remove("open");
   render();
   if(soundOn)speakCurrent();
  });
  list.appendChild(button);
 });
}

buildLanguageButtons();
render();
</script>
