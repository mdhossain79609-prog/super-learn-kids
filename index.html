<html lang="en">
<head>
<meta charset="UTF-8">

<title>SUPER LEARN KIDS</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body {
  width:100%;
  height:100%;
  height:100dvh;
  overflow:hidden;
  overscroll-behavior:none;
  font-family:Arial,Trebuchet MS,sans-serif;
}

body {
  background:linear-gradient(180deg,#05bafa,#c5f5ff);
  color:#084b91;
}

button {
  border:0;
  cursor:pointer;
  font-family:inherit;
}

.screen {
  width:100%;
  height:100%;
  height:100dvh;
  overflow:hidden;
  display:none;
  flex-direction:column;
  padding:9px 11px;
}

.screen.active {
  display:flex;
}

/* TOP BAR */

.topbar {
  height:43px;
  flex-shrink:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:5px;
}

.topgroup {
  display:flex;
  align-items:center;
  gap:7px;
}

.settings {
  width:38px;
  height:38px;
  border-radius:50%;
  background:white;
  font-size:19px;
  box-shadow:0 3px 0 #70a8d7;
}

.language {
  background:#0861bd;
  color:white;
  padding:9px 10px;
  border-radius:25px;
  font-weight:bold;
  font-size:12px;
}

.score {
  color:white;
  background:#0861bd;
  border-radius:25px;
  padding:9px 11px;
  font-weight:bold;
  font-size:12px;
}

.trophy {
  font-size:23px;
}

/* HOME SCREEN */

#homeScreen {
  justify-content:space-between;
}

.hero {
  text-align:center;
  flex-shrink:1;
  min-height:0;
}

.logo {
  font-size:clamp(34px,9vw,51px);
  font-weight:1000;
  line-height:.88;
  letter-spacing:-2px;
  color:white;
  text-shadow:3px 4px 0 #07529c;
}

.logo span {
  display:block;
  color:#ffdc20;
}

.tagline {
  display:inline-block;
  margin-top:9px;
  background:#8134dc;
  color:white;
  padding:8px 17px;
  border-radius:30px;
  font-size:13px;
  font-weight:bold;
  box-shadow:0 4px 0 #501ca2;
}

/* BOOK LOGO */

.book-area {
  height:clamp(110px,22vh,175px);
  margin:9px 0;
  border:4px solid white;
  border-radius:45px;
  background:linear-gradient(145deg,#67e5ff,#b7f5ff);
  box-shadow:0 0 16px #ffffff,0 5px 0 #6ab4e6;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-shrink:1;
  min-height:85px;
}

.book {
  position:relative;
  font-size:clamp(75px,19vw,125px);
  filter:drop-shadow(0 7px 4px #07529c55);
  animation:bookFloat 3s ease-in-out infinite;
}

@keyframes bookFloat {
  0%,100% {transform:translateY(0)}
  50% {transform:translateY(-7px)}
}

.welcome {
  font-size:clamp(16px,4vw,21px);
  font-weight:bold;
  margin:7px 0 11px;
}

.start {
  width:94%;
  padding:13px 5px;
  border:4px solid white;
  border-radius:45px;
  background:linear-gradient(#fff000,#ffad00);
  color:#08418d;
  font-size:clamp(19px,5vw,25px);
  font-weight:1000;
  box-shadow:0 5px 0 #d87900;
}

.start:active {
  transform:translateY(4px);
  box-shadow:0 1px 0 #d87900;
}

/* HOME BOTTOM */

.bottom-menu {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:#ffffffed;
  border-radius:19px;
  padding:9px 2px;
  flex-shrink:0;
}

.bottom-menu button {
  background:transparent;
  color:#123c80;
  font-size:10px;
  font-weight:bold;
  border-right:1px solid #bdd5ef;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}

.bottom-menu button:last-child {
  border:0;
}

.bottom-menu span {
  font-size:21px;
}

/* CATEGORY SCREEN */

#categoryScreen {
  gap:10px;
}

.page-heading {
  text-align:center;
  font-size:clamp(19px,5vw,25px);
  font-weight:1000;
  color:#07509b;
  margin:8px 0;
  flex-shrink:0;
}

.back {
  background:white;
  color:#07509b;
  padding:9px 15px;
  border-radius:25px;
  font-weight:bold;
  flex-shrink:0;
  align-self:flex-start;
}

.category-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  flex:1;
  min-height:0;
  align-content:center;
}

.category {
  border-radius:20px;
  border:3px solid white;
  color:white;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:90px;
  box-shadow:0 4px 0 #124d8b55;
}

.category:active {
  transform:scale(.96);
}

.category span {
  font-size:clamp(32px,9vw,47px);
}

.category strong {
  font-size:clamp(10px,3vw,14px);
  text-align:center;
}

.c1 {background:linear-gradient(145deg,#28d9ff,#0874e9)}
.c2 {background:linear-gradient(145deg,#a2f72c,#21b900)}
.c3 {background:linear-gradient(145deg,#d65bff,#8014d5)}
.c4 {background:linear-gradient(145deg,#ffb329,#f05b00)}
.c5 {background:linear-gradient(145deg,#27efc0,#00a990)}

.category-footer {
  flex-shrink:0;
  text-align:center;
  font-size:11px;
  font-weight:bold;
  padding:8px;
}

/* SHORT PHONE */

@media(max-height:650px) {
  .book-area {
    height:100px;
    min-height:75px;
    margin:5px 0;
  }

  .book {
    font-size:75px;
  }

  .tagline {
    margin-top:5px;
  }

  .welcome {
    margin:4px 0 7px;
  }

  .start {
    padding:10px;
  }

  .bottom-menu {
    padding:6px 2px;
  }

  .category-grid {
    gap:6px;
  }

  .category {
    min-height:70px;
  }
}
  
/* FIRST THREE LEARNING ICONS */

.basic-icon {
  min-height: 90px;
  border-radius: 20px;
  border: 3px solid white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 7px;
  color: white;
  box-shadow: 0 4px 0 #124d8b55;
  text-shadow: 0 3px 3px #0004;
  transition: .2s;

.basic-icon:active {

.basic-icon .letters {

.basic-icon strong {

.alphabet-icon {

}

.bangla-icon {
  background: linear-gradient(145deg,#ffbd42,#e66b08);
}

.number-icon {
  background: linear-gradient(145deg,#69ed50,#079b40);
}
/* 40 Learning Buttons */
.category-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  flex: 1;
  min-height: 0;
  align-content: start;
  overflow-y: auto;
  padding: 6px 4px 14px;
}

.learn-btn {
  min-width: 0;
  min-height: 92px;
  border: 3px solid white;
  border-radius: 19px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 6px;
  color: white;

.learn-btn:active {

.learn-btn .learn-icon {

  font-weight: 1000;
  line-height: 1.1;
}

.learn-btn strong {
  font-size: clamp(9px, 2.8vw, 12px);
  text-align: center;
  line-height: 1.2;

/* Different colorful backgrounds */
.learn-btn:nth-child(10n+1) { background: linear-gradient(145deg,#ffbd45,#ed7515); }
.learn-btn:nth-child(10n+2) { background: linear-gradient(145deg,#40caff,#1763df); }
.learn-btn:nth-child(10n+3) { background: linear-gradient(145deg,#a77aff,#7040c9); }
.learn-btn:nth-child(10n+4) { background: linear-gradient(145deg,#ff7eaa,#df347c); }
.learn-btn:nth-child(10n+5) { background: linear-gradient(145deg,#54d99a,#15965e); }
.learn-btn:nth-child(10n+6) { background: linear-gradient(145deg,#ff9b56,#e34c35); }
.learn-btn:nth-child(10n+7) { background: linear-gradient(145deg,#61c9e9,#247bbd); }
.learn-btn:nth-child(10n+8) { background: linear-gradient(145deg,#b4d94c,#5b9e28); }
.learn-btn:nth-child(10n+9) { background: linear-gradient(145deg,#e88be9,#a13cae); }
.learn-btn:nth-child(10n+10) { background: linear-gradient(145deg,#f2c85b,#c58b17); }

.learn-btn.game-btn {
  border: 3px solid #fff6a8;
  box-shadow: 0 4px 0 #8b5b1c66, 0 0 8px #ffdb59aa;
}
</style>
</head>

<script>

function openCategories() {
  document.getElementById("homeScreen").classList.remove("active");
  document.getElementById("categoryScreen").classList.add("active");
}

function goHome() {
  document.getElementById("categoryScreen").classList.remove("active");
  document.getElementById("homeScreen").classList.add("active");
}

function showMessage(text) {
  const box = document.getElementById("message");
  box.textContent = text;
  box.style.display = "block";

  clearTimeout(window.messageTimer);

  window.messageTimer = setTimeout(() => {
    box.style.display = "none";
  },2200);
}

// SHARED APP SYSTEM

function saveGlobalLanguage(language) {
  localStorage.setItem("slk_language", language);
}

function loadGlobalData() {

  const savedStars =
    localStorage.getItem("slk_stars") || "0";

  document.querySelectorAll("#globalStars").forEach(el => {
    el.textContent = savedStars;
  });

  const language =
    localStorage.getItem("slk_language") || "en";

  const selector = document.getElementById("globalLanguage");

  if (selector) {
    selector.value = language;
  }
}

loadGlobalData();
