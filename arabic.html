
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER LEARN KIDS - Arabic Alphabet</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

body{
  background:linear-gradient(145deg,#c9f4ff,#e9dcff,#fff0ce);
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:100%;
  max-width:700px;
  height:100dvh;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.header{
  text-align:center;
  padding:8px;
}

.header h1{
  color:#5531a5;
  font-size:clamp(23px,6vw,34px);
  text-shadow:2px 3px 0 white;
}

.header p{
  color:#52627d;
  font-size:13px;
  font-weight:bold;
  margin-top:5px;
}

.top-buttons{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.action-btn{
  border:3px solid white;
  border-radius:15px;
  padding:10px 18px;
  color:white;
  font-size:15px;
  font-weight:bold;
  box-shadow:0 4px 0 #0003;
}

.home-btn{
  background:linear-gradient(145deg,#ff9b43,#ed5b24);
}

.sound-btn{
  background:linear-gradient(145deg,#36bde9,#2364d8);
}

#startScreen{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
}

.start-card{
  width:100%;
  background:linear-gradient(145deg,#ffffff,#e8f5ff);
  border:4px solid white;
  border-radius:28px;
  padding:30px 15px;
  text-align:center;
  box-shadow:0 8px 18px #466aa544;
}

.start-card .big{
  font-size:75px;
  color:#df8b16;
  text-shadow:3px 4px 0 #ffe3a2;
}

.start-card h2{
  color:#5837a5;
  font-size:25px;
  margin:12px 0;
}

.start-card p{
  color:#58677e;
  font-size:15px;
  line-height:1.6;
}

.start-btn{
  margin-top:22px;
  padding:15px 35px;
  border:3px solid white;
  border-radius:18px;
  background:linear-gradient(145deg,#43dc85,#139b54);
  color:white;
  font-size:20px;
  font-weight:1000;
  box-shadow:0 5px 0 #087342;
}

#learnScreen{
  flex:1;
  min-height:0;
  display:none;
  flex-direction:column;
  gap:10px;
}

.instruction{
  background:#ffffffd9;
  border:2px solid white;
  border-radius:15px;
  padding:10px;
  color:#4d3989;
  font-size:14px;
  text-align:center;
  font-weight:bold;
}

.letter-grid{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  grid-template-rows:repeat(4,minmax(0,1fr));
  gap:7px;
}

.letter-card{
  border:3px solid white;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:linear-gradient(145deg,#ffcf59,#f18b27);
  box-shadow:0 4px 0 #9d641d66;
  color:white;
  text-shadow:0 3px 3px #0005;
  min-width:0;
  min-height:0;
  cursor:pointer;
  transition:.15s;
}

.letter-card:nth-child(7n+2){
  background:linear-gradient(145deg,#55d7ff,#2475dd);
}
.letter-card:nth-child(7n+3){
  background:linear-gradient(145deg,#a98aff,#6841c9);
}
.letter-card:nth-child(7n+4){
  background:linear-gradient(145deg,#ff8db2,#db397c);
}
.letter-card:nth-child(7n+5){
  background:linear-gradient(145deg,#65df91,#199b53);
}
.letter-card:nth-child(7n+6){
  background:linear-gradient(145deg,#ff9a5c,#df5133);
}
.letter-card:nth-child(7n+7){
  background:linear-gradient(145deg,#66d9d0,#178c9b);
}

.letter-card:active{
  transform:scale(.91);
}

.arabic{
  font-family:"Noto Naskh Arabic","Amiri",serif;
  font-size:clamp(27px,8vw,43px);
  font-weight:bold;
  line-height:1.2;
}

.bengali{
  font-size:clamp(9px,2.6vw,12px);
  font-weight:bold;
  margin-top:3px;
}

.bottom-info{
  background:white;
  border-radius:14px;
  padding:9px;
  text-align:center;
  color:#593c9a;
  font-weight:bold;
  font-size:13px;
}

@media(max-width:380px){
  .app{padding:8px;gap:7px;}
  .letter-grid{gap:5px;}
  .letter-card{border-radius:10px;}
  .arabic{font-size:clamp(24px,7.5vw,34px);}
  .bengali{font-size:9px;}
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>🌙 Arabic Alphabet</h1>
    <p>Learn Arabic Letters - أ ب ت</p>
  </div>

  <div class="top-buttons">
    <button class="action-btn home-btn" onclick="goHome()">
      🏠 HOME
    </button>

    <button class="action-btn sound-btn" onclick="stopVoice()">
      🔇 STOP
    </button>
  </div>

  <section id="startScreen">
    <div class="start-card">
      <div class="big">أ ب ت</div>
      <h2>Learn Arabic Letters!</h2>
      <p>
        Discover all 28 Arabic letters.<br>
        Tap any letter to hear its pronunciation.
      </p>

      <button class="start-btn" onclick="startLearning()">
        ▶ START LEARNING
      </button>
    </div>
  </section>

  <section id="learnScreen">

    <div class="instruction">
      👆 Tap any Arabic letter to hear its name!
    </div>

    <div class="letter-grid" id="letterGrid"></div>

    <div class="bottom-info" id="letterInfo">
      🌟 Let's Learn Arabic!
    </div>

  </section>

</div>

<script>

const letters = [
  ["ا","আলিফ"],
  ["ب","বা"],
  ["ت","তা"],
  ["ث","ছা"],
  ["ج","জীম"],
  ["ح","হা"],
  ["خ","খা"],
  ["د","দাল"],
  ["ذ","যাল"],
  ["ر","রা"],
  ["ز","ঝা"],
  ["س","সীন"],
  ["ش","শীন"],
  ["ص","সোয়াদ"],
  ["ض","দোয়াদ"],
  ["ط","ত্বা"],
  ["ظ","যোয়া"],
  ["ع","আইন"],
  ["غ","গইন"],
  ["ف","ফা"],
  ["ق","ক্বাফ"],
  ["ك","কাফ"],
  ["ل","লাম"],
  ["م","মীম"],
  ["ن","নূন"],
  ["و","ওয়াও"],
  ["ه","হা"],
  ["ي","ইয়া"]
];

const grid = document.getElementById("letterGrid");

letters.forEach((item,index)=>{

  const card = document.createElement("button");
  card.className = "letter-card";

  card.innerHTML = `
    <span class="arabic" dir="rtl">${item[0]}</span>
    <span class="bengali">${item[1]}</span>
  `;

  card.onclick = ()=>speakLetter(item,index);

  grid.appendChild(card);

});

function startLearning(){

  document.getElementById("startScreen").style.display="none";
  document.getElementById("learnScreen").style.display="flex";

}

function speakLetter(item,index){

  stopVoice();

  document.getElementById("letterInfo").textContent =
    "🔊 " + item[1] + " — " + item[0];

  const speech = new SpeechSynthesisUtterance(item[1]);

  speech.lang = "bn-BD";
  speech.rate = 0.75;
  speech.pitch = 1.1;

  speechSynthesis.speak(speech);

}

function stopVoice(){
  if("speechSynthesis" in window){
    speechSynthesis.cancel();
  }
}

function goHome(){
  stopVoice();
  window.location.href="index.html";
}

</script>

</body>
</html>
