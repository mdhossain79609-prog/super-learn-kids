
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER LEARN KIDS - Alphabet</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Trebuchet MS",Arial,sans-serif;
}

body{
  background:linear-gradient(
    125deg,
    #19c9ee,
    #7860ed,
    #ed65b5,
    #ff9b52,
    #48c9a5
  );
  background-size:300% 300%;
  animation:bgMove 14s ease infinite;
}

@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.screen{
  display:none;
  width:100%;
  height:100dvh;
  padding:9px;
  flex-direction:column;
  overflow:hidden;
}

.screen.active{display:flex}

/* TOP BAR */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-shrink:0;
}

.top-btn{
  border:2px solid #fff;
  border-radius:15px;
  padding:9px 13px;
  background:linear-gradient(145deg,#fff,#d9edff);
  color:#174f9b;
  font-size:13px;
  font-weight:1000;
  box-shadow:0 4px 0 #456b9c;
}

/* ALPHABET HOME */

.heading{
  text-align:center;
  color:#fff;
  font-size:clamp(24px,6vw,36px);
  font-weight:1000;
  margin:10px 0 3px;
  text-shadow:2px 3px 0 #4930a5,4px 6px 8px #0006;
}

.subtitle{
  text-align:center;
  color:#fff;
  font-size:12px;
  font-weight:1000;
  text-shadow:1px 2px 3px #333;
}

.mode-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:12px 0;
  flex-shrink:0;
}

.mode-btn{
  border:2px solid #fff;
  border-radius:16px;
  padding:12px 4px;
  color:white;
  font-size:clamp(11px,3vw,15px);
  font-weight:1000;
  box-shadow:0 5px 0 #0004;
}

.learn-btn{
  background:linear-gradient(145deg,#ffcf35,#ff6500);
}

.listen-btn{
  background:linear-gradient(145deg,#d15cff,#7134d9);
}

.mode-btn.selected{
  outline:3px solid white;
  transform:translateY(-2px);
}

.letter-grid{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-template-rows:repeat(7,minmax(0,1fr));
  gap:7px;
}

.letter-card{
  border:2px solid #ffffffc9;
  border-radius:15px;
  color:white;
  font-size:clamp(25px,7vw,40px);
  font-weight:1000;
  text-shadow:2px 3px 0 #3338,4px 5px 7px #0005;
  box-shadow:inset 0 3px 5px #fff9,0 5px 0 #0003;
  background:linear-gradient(145deg,#ff8baf,#e82e75);
}

.letter-card:nth-child(6n+2){
  background:linear-gradient(145deg,#64d7ff,#1676e9);
}
.letter-card:nth-child(6n+3){
  background:linear-gradient(145deg,#ffe36d,#ff8b00);
}
.letter-card:nth-child(6n+4){
  background:linear-gradient(145deg,#a8f27e,#25a94d);
}
.letter-card:nth-child(6n+5){
  background:linear-gradient(145deg,#d3a0ff,#7938d7);
}
.letter-card:nth-child(6n){
  background:linear-gradient(145deg,#ffb47b,#ed4e38);
}

.footer{
  color:white;
  text-align:center;
  font-size:11px;
  font-weight:1000;
  padding:7px 0 2px;
  flex-shrink:0;
}

/* LESSON SCREEN */
/* LESSON CONTENT DOWNWARD SPACE */

#lessonScreen{
  padding-top:9px;
}

#lessonScreen .lesson-title{
  margin-top:35px;
}
.lesson-title{
  text-align:center;
  color:#fff;
  font-size:clamp(15px,4vw,20px);
  font-weight:1000;
  margin:3px 0;
  text-shadow:2px 3px 0 #4930a5,3px 5px 6px #0006;
  flex-shrink:0;
}

/* BIG A a */

.big-letter{
  flex-shrink:0;
  width:100%;
  min-height:clamp(95px,20vh,160px);
  display:flex;
  justify-content:center;
  align-items:center;
  gap:clamp(20px,7vw,50px);
  overflow:visible;
}

.big-letter span{
  font-size:clamp(95px,27vw,155px);
  line-height:1;
  font-weight:1000;
  color:#fff72b;
  -webkit-text-stroke:2px #ff9415;
  text-shadow:
    1px 1px 0 #ffc000,
    2px 2px 0 #e68b00,
    4px 4px 0 #c35c00,
    6px 7px 0 #8d3800,
    9px 12px 12px #0008;
  animation:letterFloat 2.5s ease-in-out infinite;
}

@keyframes letterFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}

/* 3D COLORFUL TEXT */

.lesson-word{
  flex-shrink:0;
  text-align:center;
  font-size:clamp(27px,7.5vw,42px);
  font-weight:1000;
  background:linear-gradient(
    180deg,
    #ffffff 0%,
    #fff45b 25%,
    #ffad27 55%,
    #ff5b29 100%
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-stroke:1px #fff0a0;
  filter:drop-shadow(2px 3px 0 #a63d08)
         drop-shadow(4px 6px 0 #73300b)
         drop-shadow(6px 8px 5px #0006);
  padding:3px 0 7px;
  animation:wordFloat 3s ease-in-out infinite;
}

@keyframes wordFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-3px)}
}

/* PNG IMAGE AREA */

.lesson-image-box{
  flex:1;
  min-height:70px;
  max-height:230px;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.lesson-image-box img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  filter:drop-shadow(0 9px 8px #0005);
}

.image-fallback{
  display:none;
  font-size:clamp(65px,19vw,115px);
  filter:drop-shadow(0 8px 6px #0005);
}

/* APPLE - আপেল */

.bangla-word{
  flex-shrink:0;
  text-align:center;
  font-size:clamp(22px,6vw,34px);
  font-weight:1000;
  background:linear-gradient(
    180deg,
    #ffffff,
    #b9fffb 40%,
    #45e7ff 75%,
    #1685e8
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-stroke:.7px white;
  filter:drop-shadow(2px 3px 0 #1455a0)
         drop-shadow(4px 6px 0 #103e83)
         drop-shadow(5px 8px 5px #0006);
  padding:3px 0 7px;
}

/* BANGLA RHYME */

.rhyme{
  flex-shrink:0;
  width:100%;
  text-align:center;
  color:#fff;
  font-size:clamp(16px,4.5vw,23px);
  font-weight:1000;
  text-shadow:
    1px 2px 0 #a51c96,
    2px 3px 0 #76258e,
    4px 5px 0 #4e246e,
    5px 7px 7px #0007;
  padding:5px 0;
}

/* BUTTONS */

.voice-buttons{
  width:100%;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  flex-shrink:0;
  margin-top:4px;
}

.voice-btn{
  border:2px solid #fff;
  border-radius:14px;
  padding:10px 2px;
  color:white;
  font-size:clamp(10px,2.8vw,14px);
  font-weight:1000;
  text-shadow:1px 2px 2px #0005;
  box-shadow:0 5px 0 #0004;
}

.english-btn{
  background:linear-gradient(145deg,#28a8ff,#075bc9);
}
.bangla-btn{
  background:linear-gradient(145deg,#42df87,#07964d);
}
.all-btn{
  background:linear-gradient(145deg,#ffba35,#f15b08);
}

/* HOME + ALL LETTERS */

.extra-buttons{
  width:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
  flex-shrink:0;
}

.extra-btn{
  border:2px solid white;
  border-radius:14px;
  padding:9px 3px;
  color:#1455a0;
  background:linear-gradient(145deg,#fff,#d7edff);
  font-size:clamp(12px,3.3vw,15px);
  font-weight:1000;
  box-shadow:0 4px 0 #456b9c;
}

/* PREVIOUS A-Z NEXT */

.lesson-navigation{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
  margin-top:8px;
  flex-shrink:0;
}

.nav-btn{
  border:2px solid white;
  border-radius:14px;
  padding:9px 2px;
  color:#1455a0;
  background:linear-gradient(145deg,#fff,#c9e7ff);
  font-size:clamp(11px,3vw,15px);
  font-weight:1000;
  box-shadow:0 4px 0 #6597c2;
}

button:active{
  transform:translateY(3px);
}

/* SMALL SCREEN ADJUSTMENT */

@media(max-height:700px){
  .screen{padding:6px}
  .lesson-title{margin:1px 0}
  .big-letter{min-height:75px}
  .big-letter span{font-size:clamp(75px,22vw,110px)}
  .lesson-image-box{max-height:145px}
  .lesson-word{font-size:clamp(24px,6.5vw,34px)}
  .bangla-word{font-size:22px}
  .rhyme{font-size:16px;padding:3px}
  .voice-btn,.extra-btn,.nav-btn{padding:7px 2px}
  .extra-buttons{margin-top:6px}
  .lesson-navigation{margin-top:6px}
}

@media(max-height:570px){
  .big-letter{min-height:55px}
  .big-letter span{font-size:65px}
  .lesson-image-box{max-height:85px}
  .lesson-word{font-size:22px}
  .bangla-word{font-size:18px}
  .rhyme{font-size:13px}
  .voice-btn,.extra-btn,.nav-btn{padding:6px 2px}
}
</style>
</head>

<body>

<!-- A-Z SCREEN -->

<section id="alphabetScreen" class="screen active">

  <div class="topbar">
    <button class="top-btn" onclick="goHome()">⌂ HOME</button>
    <button class="top-btn">⭐</button>
  </div>

  <div class="heading">LEARN ALPHABET</div>
  <div class="subtitle">LET'S LEARN A TO Z!</div>

  <div class="mode-buttons">
    <button id="learnMode" class="mode-btn learn-btn selected">
      📖 LEARN LETTERS
    </button>
    <button id="listenMode" class="mode-btn listen-btn">
      🔊 LISTEN ABC
    </button>
  </div>

  <div id="letterGrid" class="letter-grid"></div>

  <div class="footer">LEARN • PLAY • GROW</div>
</section>


<!-- LESSON SCREEN -->

<section id="lessonScreen" class="screen">
  <!-- TOP HOME + ALL LETTERS -->

  <div class="topbar">
    <button class="top-btn" onclick="goHome()">⌂ HOME</button>
    <button class="top-btn" onclick="backToLetters()">
      ⭐ ALL LETTERS
    </button>
  </div>
  <div class="lesson-title">
    LET'S LEARN A NEW LETTER!
  </div>

  <!-- A a -->

  <div class="big-letter">
    <span id="capitalLetter">A</span>
    <span id="smallLetter">a</span>
  </div>

  <!-- A for Apple -->

  <div id="lessonWord" class="lesson-word">
    A for Apple
  </div>

  <!-- PNG IMAGE -->

  <div class="lesson-image-box">

    <img
      id="lessonObjectImage"
      src="images/A-apple.png"
      alt="Apple"
    >

    <div id="imageFallback" class="image-fallback">🍎</div>

  </div>

  <!-- ENGLISH - BANGLA -->

  <div id="banglaWord" class="bangla-word">
    Apple – আপেল
  </div>

  <!-- RHYME -->

  <div id="rhyme" class="rhyme">
    আপেলটি খেতে ভারি মজা।
  </div>

  <!-- VOICE BUTTONS -->

  <div class="voice-buttons">

    <button class="voice-btn english-btn" onclick="speakEnglish()">
      🔊 ENGLISH
    </button>

    <button class="voice-btn bangla-btn" onclick="speakBangla()">
      🔊 বাংলা
    </button>

    <button class="voice-btn all-btn" onclick="speakAll()">
      ▶ LISTEN ALL
    </button>

  </div>

  <!-- PREVIOUS + A-Z + NEXT -->

  <div class="lesson-navigation">

    <button class="nav-btn" onclick="previousLetter()">
      ◀ PREVIOUS
    </button>

    <button class="nav-btn" onclick="backToLetters()">
      A–Z
    </button>

    <button class="nav-btn" onclick="nextLetter()">
      NEXT ▶
    </button>

  </div>

</section>


<script>

/* A TO Z DATA */

const alphabetData = [

 ["A","Apple","আপেল","আপেলটি খেতে ভারি মজা।","🍎"],
 ["B","Ball","বল","বল নিয়ে খেলতে মজা।","⚽"],
 ["C","Cat","বিড়াল","বিড়ালটি করে মিউ মিউ।","🐱"],
 ["D","Dog","কুকুর","কুকুরটি দৌড়ায় রোজ।","🐶"],
 ["E","Elephant","হাতি","হাতিটি অনেক বড়।","🐘"],
 ["F","Fish","মাছ","মাছটি পানিতে সাঁতার কাটে।","🐟"],
 ["G","Grapes","আঙুর","আঙুর খেতে ভারি মজা।","🍇"],
 ["H","House","বাড়ি","এটি আমাদের সুন্দর বাড়ি।","🏠"],
 ["I","Ice Cream","আইসক্রিম","ঠান্ডা ঠান্ডা আইসক্রিম।","🍦"],
 ["J","Juice","জুস","ফলের জুস খেতে মজা।","🧃"],
 ["K","Kite","ঘুড়ি","ঘুড়ি ওড়ে আকাশে।","🪁"],
 ["L","Lion","সিংহ","সিংহ বনের রাজা।","🦁"],
 ["M","Monkey","বানর","বানরটি লাফায় গাছে।","🐒"],
 ["N","Nest","বাসা","পাখির ছোট্ট বাসা।","🪺"],
 ["O","Orange","কমলা","কমলা খেতে মিষ্টি।","🍊"],
 ["P","Panda","পান্ডা","পান্ডা দেখতে মিষ্টি।","🐼"],
 ["Q","Queen","রানি","রানি থাকেন প্রাসাদে।","👑"],
 ["R","Rabbit","খরগোশ","খরগোশ লাফিয়ে চলে।","🐰"],
 ["S","Sun","সূর্য","সূর্য আমাদের আলো দেয়।","☀️"],
 ["T","Tiger","বাঘ","বাঘের গায়ে ডোরা দাগ।","🐯"],
 ["U","Umbrella","ছাতা","ছাতা বৃষ্টিতে কাজে লাগে।","☂️"],
 ["V","Van","ভ্যান","ভ্যানে চড়ে যাই।","🚐"],
 ["W","Watch","ঘড়ি","ঘড়ি আমাদের সময় জানায়।","⌚"],
 ["X","Xylophone","জাইলোফোন","এতে বাজে মিষ্টি সুর।","🎵"],
 ["Y","Yo-yo","ইয়ো ইয়ো","ইয়ো ইয়ো খেলতে ভালো।","🪀"],
 ["Z","Zebra","জেব্রা","জেব্রার গায়ে সাদা কালো দাগ।","🦓"]

];

let selectedMode = "learn";
let selectedIndex = 0;

const grid = document.getElementById("letterGrid");


/* CREATE A-Z GRID */

function createLetters(){

  grid.innerHTML = "";

  alphabetData.forEach((item,index)=>{

    const card = document.createElement("button");

    card.className = "letter-card";
    card.textContent = item[0];

    card.onclick = ()=>openLetter(index);

    grid.appendChild(card);

  });

}


/* MODE SELECT */

function selectMode(mode){

  selectedMode = mode;

  document.getElementById("learnMode")
    .classList.toggle("selected",mode==="learn");

  document.getElementById("listenMode")
    .classList.toggle("selected",mode==="listen");

}

document.getElementById("learnMode").onclick =
  ()=>selectMode("learn");

document.getElementById("listenMode").onclick =
  ()=>selectMode("listen");


/* OPEN LETTER */

function openLetter(index){

  selectedIndex = index;

  const item = alphabetData[index];

  if(selectedMode==="listen"){

    speakText(item[0],"en-US");
    return;

  }

  updateLesson();

  showScreen("lessonScreen");

}


/* UPDATE LESSON CONTENT */

function updateLesson(){

  const item = alphabetData[selectedIndex];

  document.getElementById("capitalLetter").textContent =
    item[0];

  document.getElementById("smallLetter").textContent =
    item[0].toLowerCase();

  document.getElementById("lessonWord").textContent =
    item[0]+" for "+item[1];

  document.getElementById("banglaWord").textContent =
    item[1]+" – "+item[2];

  document.getElementById("rhyme").textContent =
    item[3];

  const imageName = item[1]
    .toLowerCase()
    .replace(/\s+/g,"-");

  const imageFile =
    "images/"+item[0]+"-"+imageName+".png";

  const img = document.getElementById("lessonObjectImage");
  const fallback = document.getElementById("imageFallback");

  fallback.textContent = item[4];
  fallback.style.display = "none";

  img.style.display = "block";
  img.src = imageFile;

  img.onerror = function(){

    img.style.display = "none";
    fallback.style.display = "block";

  };

  img.onload = function(){

    img.style.display = "block";
    fallback.style.display = "none";

  };

}


/* SCREEN CONTROL */

function showScreen(id){

  document.querySelectorAll(".screen").forEach(screen=>{
    screen.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

}

function backToLetters(){

  stopVoice();
  selectMode("learn");
  showScreen("alphabetScreen");

}

function goHome(){

  stopVoice();
  window.location.href = "index.html";

}


/* PREVIOUS AND NEXT */

function previousLetter(){

  stopVoice();

  selectedIndex = (selectedIndex+25)%26;

  selectMode("learn");
  updateLesson();

}

function nextLetter(){

  stopVoice();

  selectedIndex = (selectedIndex+1)%26;

  selectMode("learn");
  updateLesson();

}


/* VOICE SYSTEM */

function stopVoice(){

  if("speechSynthesis" in window){
    window.speechSynthesis.cancel();
  }

}

function speakText(text,language,onEnd){

  if(!("speechSynthesis" in window)){

    alert("আপনার ব্রাউজারে Voice Support পাওয়া যায়নি।");
    return;

  }

  stopVoice();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = language;

  /* CHILDLIKE SOUND SETTINGS */

  speech.pitch = 1.3;
  speech.rate = 0.85;
  speech.volume = 1;

  const voices = window.speechSynthesis.getVoices();

  let voice = null;

  if(language.startsWith("bn")){

    voice = voices.find(v=>
      v.lang.toLowerCase().startsWith("bn")
    );

  }else{

    voice = voices.find(v=>
      v.lang.toLowerCase().startsWith("en")
    );

  }

  if(voice){
    speech.voice = voice;
  }

  if(onEnd){
    speech.onend = onEnd;
  }

  window.speechSynthesis.speak(speech);

}


/* ENGLISH VOICE */

function speakEnglish(){

  const item = alphabetData[selectedIndex];

  speakText(
    item[0]+" for "+item[1],
    "en-US"
  );

}


/* BANGLA VOICE */

function speakBangla(){

  const item = alphabetData[selectedIndex];

  speakText(
    item[1]+". "+item[2]+". "+item[3],
    "bn-BD"
  );

}


/* LISTEN ALL: ENGLISH THEN BANGLA */

function speakAll(){

  const item = alphabetData[selectedIndex];

  speakText(
    item[0]+" for "+item[1],
    "en-US",
    function(){

      speakText(
        item[1]+". "+item[2]+". "+item[3],
        "bn-BD"
      );

    }
  );

}


/* START */

createLetters();
selectMode("learn");

</script>

</body>
</html>
