.m1{background:linear-gradient(145deg,#ff9c37,#ef5c23)}
.m2{background:linear-gradient(145deg,#32caff,#0874d9)}

@media(min-width:600px){

function shuffle(array) {
  const a = [...array];

  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }

  return a;
}

function updateStars() {
  localStorage.setItem("slk_stars", score);
  document.getElementById("stars").textContent = score;
}

function speak(text, lang = "word") {
  if (!("speechSynthesis" in window)) {
    showMessage("এই ডিভাইসে ভয়েস সুবিধা পাওয়া যাচ্ছে না।");
    return;
  }

  speechSynthesis.cancel();

  const codes = {
    bn: "bn-BD",
    word: "en-US",
    hi: "hi-IN",
    ar: "ar-SA",
    es: "es-ES",
    fr: "fr-FR",
    ur: "ur-PK",
    zh: "zh-CN",
    ja: "ja-JP",
    de: "de-DE"
  };

  const utterance = new SpeechSynthesisUtterance(String(text || ""));
  utterance.lang = codes[lang] || "en-US";
  utterance.rate = 0.82;

  speechSynthesis.speak(utterance);
}

// ========================================

let wordQueue = [];
let queueIndex = 0;

function prepareQueue(pool) {
  wordQueue = shuffle(pool);
  queueIndex = 0;
}

function randomWord() {
  if (!wordQueue.length || queueIndex >= wordQueue.length) {
    prepareQueue(activePool.length ? activePool : uniqueWords);
  }

  return wordQueue[queueIndex++];
}

function getOptions(answer) {
  const others = activePool.filter(
    w => w.word !== answer.word
  );

  const selected = shuffle(others).slice(0, 3);

  return shuffle([answer, ...selected]);
}

function goHome() {
  if (memoryTimer) clearTimeout(memoryTimer);

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

  document.getElementById("home").classList.remove("hidden");
  document.getElementById("game").classList.add("hidden");
  document.getElementById("meaningModal").classList.add("hidden");

  categoryMode = false;
  current = null;
}

function start(m) {
  mode = m;
  round = 0;
  categoryMode = false;
  categoryName = "";
  activePool = uniqueWords;

  prepareQueue(activePool);

  document.getElementById("home").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  const names = {
    explore: "🌍 Explore & Learn",
    listen: "👂 Listen & Find",
    match: "🔗 Picture Matching",
    drag: "🧲 Drag & Drop",
    builder: "🔠 Word Builder",
    trace: "✏️ Draw & Trace",
    color: "🎨 Color & Create",
    memory: "🧠 Memory Challenge",
    quiz: "🏆 Brain Quiz",
    treasure: "💎 Treasure Adventure"
  };

  document.getElementById("modeTitle").textContent = names[m];

  if (m === "memory") {
    setupMemory();
  } else {
    nextQuestion();
  }
}

function nextQuestion() {
  questionLocked = false;

  current = randomWord();

  round++;

  document.getElementById("progress").style.width =
    Math.min((round % 10) * 10 || 10, 100) + "%";

  if (mode === "explore") showExplore();
  else if (mode === "listen") showListen();
  else if (mode === "match") showMatch();
  else if (mode === "drag") showDrag();
  else if (mode === "builder") showBuilder();
  else if (mode === "trace") showTrace();
  else if (mode === "color") showColor();
  else if (mode === "quiz") showQuiz();
  else if (mode === "treasure") showTreasure();
}

function checkAnswer(answer) {
  if (questionLocked) return;

  if (answer === current.word) {
    questionLocked = true;
    correct();
  } else {
    showMessage("❌ আবার চেষ্টা করো! তুমি পারবে! 😊");
  }
}

function showMessage(message) {
  const area = document.getElementById("playArea");
  let feedback = document.getElementById("feedback");

  if (!feedback) {
    feedback = document.createElement("div");
    feedback.id = "feedback";
    feedback.className = "small";
    area.appendChild(feedback);
  }

  feedback.textContent = message;
  feedback.style.color = "#e34b55";
  feedback.style.fontWeight = "bold";
}

  const letters = shuffle(
    current.word.toUpperCase().split("")

  document.getElementById("playArea").innerHTML = `

      ${"_ ".repeat(letters.length)}
    </div>

    <div class="answers">
      ${letters.map((l, i) => `
        <button class="answer"
          id="letter${i}"
          onclick="addLetter('${l}',${i})">
          ${l}
        </button>
      `).join("")}
    </div>

    <div style="text-align:center">
      <button class="action" onclick="checkBuilder()">
        CHECK WORD
      </button>

      <button class="action secondary" onclick="undoLetter()">
        ⌫ DELETE
      </button>

      <button class="action secondary" onclick="nextQuestion()">
        SKIP
      </button>
    </div>

    <div id="feedback"></div>
  `;

  window.builderLetters = letters;
}

function addLetter(letter, index) {
  if (builderUsed.includes(index)) return;

  builderUsed.push(index);
  builderAnswer.push({ letter, index });

  document.getElementById("letter" + index).disabled = true;

  document.getElementById("builtWord").textContent =
    builderAnswer.map(x => x.letter).join("");
}

function undoLetter() {
  const last = builderAnswer.pop();

  if (!last) return;

  builderUsed = builderUsed.filter(i => i !== last.index);

  document.getElementById("letter" + last.index).disabled = false;

  document.getElementById("builtWord").textContent =
    builderAnswer.map(x => x.letter).join("") +
    "_".repeat(window.builderLetters.length - builderAnswer.length);
}

function checkBuilder() {
  const answer = builderAnswer.map(x => x.letter).join("");

  if (answer === current.word.toUpperCase()) {
    questionLocked = true;
    correct();
  } else {
    showMessage("আবার চেষ্টা করো! অক্ষরগুলো সাজাও। 😊");
  }
}

function showTrace() {

    </div>

    <div class="picture">${current.pic}</div>

    <div class="word">${current.word}</div>

    <canvas id="drawCanvas" class="canvas"></canvas>

    <div style="text-align:center">
      <button class="action secondary" onclick="clearCanvas()">
        CLEAR
      </button>

      <button class="action" onclick="finishCreative()">
        DONE ⭐
      </button>
    </div>
  `;

  setupCanvas();
}

function setupCanvas() {
  canvas = document.getElementById("drawCanvas");
  ctx = canvas.getContext("2d");

  const rect = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;

  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;

  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#7138d9";

  canvas.onpointerdown = e => {
    drawing = true;
    const r = canvas.getBoundingClientRect();

    ctx.beginPath();
    ctx.moveTo(e.clientX - r.left, e.clientY - r.top);
  };

  canvas.onpointermove = e => {
    if (!drawing) return;

    const r = canvas.getBoundingClientRect();

    ctx.lineTo(e.clientX - r.left, e.clientY - r.top);
    ctx.stroke();
  };

  canvas.onpointerup = () => drawing = false;
  canvas.onpointercancel = () => drawing = false;
  canvas.onpointerleave = () => drawing = false;
}

function clearCanvas() {
  if (!canvas || !ctx) return;

  const ratio = window.devicePixelRatio || 1;

  ctx.clearRect(
    0, 0,
    canvas.width / ratio,
    canvas.height / ratio
  );
}

function finishCreative() {
  if (creativeFinished) return;

  creativeFinished = true;
  score += 2;
  updateStars();

  showMeaning(current);
}

// ========================================
// 8. MEMORY CHALLENGE
// ========================================

function setupMemory() {
  if (memoryTimer) clearTimeout(memoryTimer);

  const selectedWords = shuffle(uniqueWords).slice(0, 4);

  memoryCards = shuffle(
    selectedWords.flatMap((w, i) => [
      { id: i, value: w.pic, word: w.word },
      { id: i, value: w.bn, word: w.word }
    ])
  );

  memoryOpen = [];
  memoryDone = [];

  document.getElementById("playArea").innerHTML = `
    <div class="question">
      🧠 একই ছবি ও অর্থের জোড়া খুঁজে বের করো
    </div>

    <div class="memory-grid">
      ${memoryCards.map((c, i) => `
        <button class="memory-card"
          id="mem${i}"
          onclick="flipMemory(${i})">
          ❓
        </button>
      `).join("")}
    </div>

    <div class="small" id="memoryInfo">
      ৪টি জোড়া খুঁজে বের করো!
    </div>
  `;
}

function flipMemory(index) {
  if (memoryDone.includes(memoryCards[index].id)) return;

  if (memoryOpen.some(x => x.index === index)) return;

  if (memoryOpen.length >= 2) return;

  const card = memoryCards[index];

  const button = document.getElementById("mem" + index);

  button.textContent = card.value;
  button.classList.add("open");

  memoryOpen.push({
    index,
    id: card.id,
    word: card.word
  });

  if (memoryOpen.length === 2) {
    if (memoryOpen[0].id === memoryOpen[1].id) {
      const matchedId = memoryOpen[0].id;
      const matchedWord = memoryOpen[0].word;

      memoryDone.push(matchedId);
      memoryOpen = [];

      score += 5;
      updateStars();

      document.getElementById("memoryInfo").textContent =
        "🎉 সঠিক জোড়া!";

      if (memoryDone.length === 4) {
        memoryTimer = setTimeout(() => {
          current = uniqueWords.find(w => w.word === matchedWord);
          showMeaning(current, true);
        }, 400);
      }
    } else {
      memoryTimer = setTimeout(() => {
        memoryOpen.forEach(x => {
          const b = document.getElementById("mem" + x.index);

          if (b) {
            b.textContent = "❓";
            b.classList.remove("open");
          }
        });

        memoryOpen = [];

        document.getElementById("memoryInfo").textContent =
          "আবার চেষ্টা করো!";
      }, 850);
    }
  }
}

// ========================================
// TEN LANGUAGE DISPLAY
// ========================================

function showMeaning(w, memoryComplete = false) {
  if (!w) return;

  document.getElementById("modalWord").textContent =
    w.pic + " " + w.word;

  const meaningList = document.getElementById("meaningList");

  meaningList.innerHTML = langs.map(([name, key]) => {
    const value = key === "word" ? w.word : w[key];

    return `
      <button class="language-item"
        onclick="speakMeaning('${key}')">
        <b>${name} 🔊</b>
        <span>${value || "—"}</span>
      </button>
    `;
  }).join("");

  window.meaningWord = w;

  document.getElementById("meaningModal").classList.remove("hidden");

  const next = document.querySelector("#meaningModal .modalbox .action");

  next.textContent = "NEXT ➜";

  next.onclick = function() {
    closeMeaning(memoryComplete);
  };
}

function speakMeaning(key) {
  if (!window.meaningWord) return;

  const value = key === "word"
    ? window.meaningWord.word
    : window.meaningWord[key];

  if (value) speak(value, key);
}

function closeMeaning(memoryComplete = false) {
  document.getElementById("meaningModal").classList.add("hidden");

  if (memoryComplete) {
    setupMemory();
  } else if (mode === "trace" || mode === "color") {
    nextQuestion();
  } else {
    nextQuestion();
  }
}

function openCategory(cat) {
  const found = uniqueWords.filter(w => w.category === cat);

  if (!found.length) {
    alert("এই ক্যাটাগরিতে এখনো কোনো শব্দ নেই।");
    return;
  }

  categoryMode = true;
  categoryName = cat;
  activePool = found;
  mode = "explore";

  prepareQueue(activePool);

  round = 0;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  document.getElementById("modeTitle").textContent =
    "📚 " + cat + " Category";

  nextQuestion();
}
