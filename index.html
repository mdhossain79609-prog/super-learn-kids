
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0799ed">
<meta name="description" content="SUPER LEARN KIDS - Learn, Explore and Grow!">
<title>SUPER LEARN KIDS</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Trebuchet MS', Arial, sans-serif;
  background: linear-gradient(180deg,#20b9fa,#d9f8ff 65%,#a7ed69);
  color: #12336d;
  min-height: 100vh;
  overflow-x: hidden;
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  -webkit-tap-highlight-color: transparent;
}

.home {
  width: 100%;
  max-width: 1250px;
  margin: auto;
  min-height: 100vh;
  padding: 12px 18px 20px;
  position: relative;
}

/* TOP BAR */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  position: relative;
  z-index: 5;
}

.top-left, .top-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.round-btn {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(145deg,#fff,#d4e9ff);
  box-shadow: 0 4px 0 #3979cb;
  font-size: 25px;
}

.language {
  padding: 11px 15px;
  border-radius: 30px;
  background: #0759bd;
  color: white;
  font-size: 14px;
  font-weight: bold;
}

.score {
  background: #0759bd;
  color: white;
  border-radius: 30px;
  padding: 10px 15px;
  font-weight: bold;
}

.trophy {
  font-size: 30px;
}

/* HERO */

.hero {
  text-align: center;
  padding: 15px 0 5px;
  position: relative;
}

.logo {
  display: inline-block;
  font-size: clamp(34px,8vw,70px);
  font-weight: 1000;
  line-height: 0.95;
  color: white;
  letter-spacing: -2px;
  text-shadow:
    3px 4px 0 #124b9c,
    5px 7px 0 #073c7d,
    0 9px 15px #13518c66;
}

.logo span {
  display: block;
  color: #ffda27;
}

.tagline {
  display: inline-block;
  margin-top: 12px;
  padding: 8px 22px;
  border-radius: 30px;
  background: #7334dc;
  color: white;
  font-weight: bold;
  font-size: 15px;
  box-shadow: 0 4px 0 #4c1ba4;
}

/* HERO CHARACTERS */

.adventure {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin: 12px auto 0;
  min-height: 145px;
  position: relative;
}

.character {
  font-size: clamp(65px,15vw,120px);
  filter: drop-shadow(0 7px 5px #165e9b55);
  animation: float 3s ease-in-out infinite;
}

.character.robot {
  animation-delay: .7s;
}

.globe {
  font-size: clamp(40px,9vw,75px);
}

.rocket {
  position: absolute;
  top: 0;
  right: 9%;
  font-size: 45px;
  transform: rotate(-25deg);
  animation: float 2.5s infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}

.welcome {
  color: #07509b;
  font-size: clamp(17px,4vw,25px);
  font-weight: 900;
  margin: 4px 0 14px;
}

/* START BUTTON */

.start-btn {
  display: block;
  width: min(95%,440px);
  margin: 0 auto 23px;
  padding: 17px 12px;
  border-radius: 50px;
  background: linear-gradient(180deg,#fff44d,#ffad00);
  color: #073b90;
  font-size: clamp(20px,5vw,29px);
  font-weight: 1000;
  border: 4px solid white;
  box-shadow: 0 7px 0 #d87500, 0 10px 15px #13528b55;
  transition: .15s;
}

.start-btn:active {
  transform: translateY(5px);
  box-shadow: 0 2px 0 #d87500;
}

/* SUBJECT CARDS */

.subject-title {
  text-align: center;
  font-size: 19px;
  font-weight: 900;
  margin-bottom: 12px;
  color: #07509b;
}

.subjects {
  display: grid;
  grid-template-columns: repeat(5,1fr);
  gap: 12px;
}

.subject {
  min-width: 0;
  min-height: 135px;
  border-radius: 23px;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 7px;
  padding: 12px 4px;
  border: 3px solid #ffffffaa;
  box-shadow: 0 6px 0 #154b9a55;
  transition: .2s;
}

.subject:active {
  transform: scale(.95);
}

.subject .emoji {
  font-size: clamp(30px,6vw,52px);
  filter: drop-shadow(0 3px 2px #0003);
}

.subject strong {
  font-size: clamp(11px,1.6vw,17px);
  text-align: center;
  text-shadow: 0 2px 3px #0004;
}

.science {
  background: linear-gradient(145deg,#27d9ff,#0874e9);
}

.technology {
  background: linear-gradient(145deg,#a2f72c,#21b900);
}

.math {
  background: linear-gradient(145deg,#d65bff,#8014d5);
}

.english {
  background: linear-gradient(145deg,#ffb329,#f05b00);
}

.games {
  background: linear-gradient(145deg,#27efc0,#00a990);
}

/* BOTTOM MENU */

.bottom-menu {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  background: #ffffffed;
  border-radius: 28px;
  padding: 12px 5px;
  margin: 27px auto 0;
  max-width: 850px;
  box-shadow: 0 5px 0 #729bd7;
}

.bottom-item {
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  color: #12336d;
  font-weight: bold;
  font-size: clamp(10px,2vw,15px);
  border-right: 2px solid #c5d8ff;
}

.bottom-item:last-child {
  border-right: none;
}

.bottom-item span {
  font-size: 25px;
}

/* FOOTER */

.footer {
  text-align: center;
  margin-top: 22px;
  color: #07509b;
  font-weight: bold;
  font-size: 12px;
}

/* MESSAGE */

.message {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #073d83;
  color: white;
  padding: 13px 22px;
  border-radius: 30px;
  z-index: 20;
  display: none;
  text-align: center;
  width: max-content;
  max-width: 90%;
  box-shadow: 0 4px 15px #0003;
}

/* MOBILE */

@media(max-width:600px) {
  .home {
    padding: 10px 10px 18px;
  }

  .topbar {
    gap: 5px;
  }

  .top-left, .top-right {
    gap: 6px;
  }

  .round-btn {
    width: 39px;
    height: 39px;
    font-size: 20px;
  }

  .language {
    padding: 9px 10px;
    font-size: 12px;
  }

  .score {
    padding: 9px 10px;
    font-size: 12px;
  }

  .trophy {
    font-size: 24px;
  }

  .hero {
    padding-top: 20px;
  }

  .adventure {
    min-height: 105px;
    gap: 4px;
  }

  .character {
    font-size: 75px;
  }

  .rocket {
    font-size: 30px;
  }

  .subjects {
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
  }

  .subject {
    min-height: 112px;
    border-radius: 19px;
  }

  .subject .emoji {
    font-size: 38px;
  }

  .subject strong {
    font-size: 13px;
  }

  .bottom-menu {
    margin-top: 22px;
    padding: 12px 3px;
  }

  .bottom-item span {
    font-size: 22px;
  }
}

@media(max-width:360px) {
  .character {
    font-size: 60px;
  }

  .subjects {
    gap: 7px;
  }

  .subject {
    min-height: 100px;
  }

  .bottom-item {
    font-size: 9px;
  }
}
</style>
</head>

<body>

<main class="home">

  <!-- TOP BAR -->
  <header class="topbar">

    <div class="top-left">
      <button class="round-btn" onclick="showMessage('Settings coming soon!')">
        ⚙️
      </button>

      <select class="language" id="language"
        onchange="showMessage('Language selection: '+this.value)">
        <option value="English">🌐 English</option>
        <option value="বাংলা">🌐 বাংলা</option>
        <option value="Hindi">🌐 Hindi</option>
        <option value="Spanish">🌐 Spanish</option>
        <option value="Arabic">🌐 Arabic</option>
      </select>
    </div>

    <div class="top-right">
      <div class="score">⭐ 0</div>
      <div class="trophy">🏆</div>
    </div>

  </header>

  <!-- HERO SECTION -->
  <section class="hero">

    <div class="logo">
      SUPER
      <span>LEARN</span>
      <span style="color:#ffdf27">KIDS</span>
    </div>

    <div class="tagline">
      LEARN • EXPLORE • GROW
    </div>

    <div class="adventure">

      <div class="globe">🌍</div>

      <div class="character">👦🏻</div>

      <div class="character">👧🏻</div>

      <div class="character robot">🤖</div>

      <div class="rocket">🚀</div>

    </div>

    <div class="welcome">
      Your Future Starts Here! ✨
    </div>

    <button class="start-btn" onclick="startLearning()">
      ▶ START LEARNING
    </button>

  </section>

  <!-- SUBJECTS -->
  <section>

    <h2 class="subject-title">
      🌟 EXPLORE YOUR WORLD 🌟
    </h2>

    <div class="subjects">

      <button class="subject science"
        onclick="openSubject('Science')">
        <span class="emoji">🧪</span>
        <strong>Science</strong>
      </button>

      <button class="subject technology"
        onclick="openSubject('Technology')">
        <span class="emoji">💻</span>
        <strong>Technology</strong>
      </button>

      <button class="subject math"
        onclick="openSubject('Mathematics')">
        <span class="emoji">➕</span>
        <strong>Mathematics</strong>
      </button>

      <button class="subject english"
        onclick="openSubject('English')">
        <span class="emoji">📖</span>
        <strong>English</strong>
      </button>

      <button class="subject games"
        onclick="openSubject('Fun Games')">
        <span class="emoji">🎮</span>
        <strong>Fun Games</strong>
      </button>

    </div>

  </section>

  <!-- BOTTOM MENU -->
  <nav class="bottom-menu">

    <button class="bottom-item"
      onclick="showMessage('My Progress coming soon!')">
      <span>📊</span>
      My Progress
    </button>

    <button class="bottom-item"
      onclick="showMessage('Help Center coming soon!')">
      <span>❓</span>
      Help Center
    </button>

    <button class="bottom-item"
      onclick="showMessage('Rewards coming soon!')">
      <span>🎁</span>
      Rewards
    </button>

    <button class="bottom-item"
      onclick="showMessage('About SUPER LEARN KIDS')">
      <span>💗</span>
      About Us
    </button>

  </nav>

  <footer class="footer">
    LEARN • BUILD • DISCOVER • CREATE
    <br><br>
    © 2026 SUPER LEARN KIDS
  </footer>

</main>

<div class="message" id="message"></div>

<script>

function showMessage(text) {
  const box = document.getElementById("message");
  box.textContent = text;
  box.style.display = "block";

  clearTimeout(window.messageTimer);

  window.messageTimer = setTimeout(() => {
    box.style.display = "none";
  }, 2200);
}

function startLearning() {
  showMessage("Welcome to SUPER LEARN KIDS! 🚀");
}

function openSubject(name) {
  showMessage(name + " - Learning section coming soon!");
}

</script>

</body>
</html>
