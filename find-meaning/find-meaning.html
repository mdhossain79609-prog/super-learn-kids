
<!DOCTYPE html>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 font-family:Arial,sans-serif;
 background:linear-gradient(145deg,#d8f6ff,#f4e5ff,#fff3d9);
 color:#26366d;min-height:100vh;
}
button{border:0;cursor:pointer;font-family:inherit}
header{
 background:linear-gradient(120deg,#7138d9,#2489e9);
 color:white;padding:13px 12px;
 border-radius:0 0 25px 25px;
 box-shadow:0 5px 0 #5424a8;
}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:19px;font-weight:1000}
.stars{background:#fff;color:#6940bc;padding:8px 13px;border-radius:20px;font-weight:bold}

main{padding:13px;max-width:850px;margin:auto}
h2{text-align:center;font-size:21px;margin:13px 0;color:#5630a7}
.intro{text-align:center;font-size:13px;margin-bottom:13px}
.grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:11px;
}
.mode{

.mode:active{transform:scale(.96)}
.mode span{font-size:35px}
.mode strong{font-size:13px;text-align:center}
.m1{background:linear-gradient(145deg,#ff9c37,#ef5c23)}
.m2{background:linear-gradient(145deg,#32caff,#0874d9)}
.m3{background:linear-gradient(145deg,#a56bff,#6833c8)}
.m4{background:linear-gradient(145deg,#ff75a7,#d92e78)}
.m5{background:linear-gradient(145deg,#4edca0,#078b61)}
.m6{background:linear-gradient(145deg,#ffd34b,#ed9212)}
.m7{background:linear-gradient(145deg,#35d9d9,#078d9c)}
.m8{background:linear-gradient(145deg,#ff8b64,#e64a35)}
.m9{background:linear-gradient(145deg,#9b9dfc,#5553c9)}
.m10{background:linear-gradient(145deg,#b5d94d,#57952a)}
.panel{
 background:white;border:3px solid #fff;border-radius:23px;
 padding:15px;margin-top:13px;
 box-shadow:0 5px 15px #354a8220;
}
.hidden{display:none!important}
.back{
 background:#fff;color:#5530a5;padding:9px 15px;
 border-radius:20px;font-weight:bold;margin-bottom:10px;
}
.question{text-align:center;font-size:18px;font-weight:900;margin:13px 0}
.picture{
 font-size:90px;text-align:center;padding:12px;
 background:linear-gradient(145deg,#e4f8ff,#f5eaff);
 border-radius:20px;margin:10px 0;
}
.word{text-align:center;font-size:27px;font-weight:1000;color:#7138d9;margin:10px}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.answer{
 background:#e9f4ff;color:#164c8c;border:2px solid #c8e2ff;

}
.answer:active{transform:scale(.96)}
.action{
 background:linear-gradient(120deg,#ffcf32,#ff9624);
 color:#593300;border-radius:25px;padding:12px 18px;
 font-weight:1000;margin:7px 3px;
}
.secondary{background:#e8e0ff;color:#5831a5}
.small{font-size:12px;color:#69718c;text-align:center;margin:9px}
.progress{height:10px;background:#e4e8f3;border-radius:20px;overflow:hidden}
.progress div{height:100%;width:0;background:#24c58a}
.language-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.language-item{
 background:#f1f4ff;padding:11px;border-radius:13px;
 text-align:left;border:2px solid #e0e5ff;
}
.language-item b{display:block;font-size:11px;color:#6b54ad;margin-bottom:5px}
.language-item span{font-size:16px;font-weight:bold}
.modal{
 position:fixed;inset:0;background:#151333b9;
 display:flex;align-items:center;justify-content:center;
 padding:13px;z-index:20;
}
.modalbox{
 width:100%;max-width:470px;max-height:90vh;overflow:auto;
 background:linear-gradient(145deg,#fff,#e9f6ff);
 border:4px solid white;border-radius:25px;padding:17px;
 box-shadow:0 12px 40px #0005;
}
.success{text-align:center;font-size:25px;font-weight:1000;color:#159d68}
.modalword{text-align:center;font-size:35px;margin:8px}
.canvas{
 width:100%;height:230px;background:white;border:3px dashed #a995e5;
 border-radius:17px;touch-action:none;
}
.colors{display:flex;justify-content:center;gap:9px;margin:10px;flex-wrap:wrap}
.color{
 width:32px;height:32px;border-radius:50%;border:3px solid white;
 box-shadow:0 0 0 1px #aaa;
}
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.memory-card{
 min-height:75px;border-radius:14px;background:#7145d4;color:white;
 font-size:27px;font-weight:bold;
}
.memory-card.open{background:#e7f5ff;color:#253c79}
.drag-option{
 padding:13px;background:#e9e1ff;border-radius:13px;
 text-align:center;font-weight:bold;margin:6px;
}
@media(min-width:600px){
 .grid{grid-template-columns:repeat(3,1fr)}
 .language-list{grid-template-columns:repeat(2,1fr)}
}

<body>

<header>
 <div class="top">
  <button onclick="goHome()" style="background:white;border-radius:20px;padding:8px 12px;color:#5730a7">⌂ HOME</button>
  <div class="brand">🌍 FIND THE MEANING</div>
  <div class="stars">⭐ <span id="stars">0</span></div>
 </div>
 <div class="sub">LEARN • PLAY • DRAW • DISCOVER</div>
</header>

<main>

<section id="home">
 <h2>🌈 Welcome to Word World!</h2>
 <p class="intro">শিখি, খেলি, আঁকি এবং ১০টি ভাষায় শব্দের অর্থ জানি।</p>

 <div class="grid">
  <button class="mode m1" onclick="start('explore')"><span>🌍</span><strong>1. Explore & Learn</strong></button>
  <button class="mode m2" onclick="start('listen')"><span>👂</span><strong>2. Listen & Find</strong></button>
  <button class="mode m3" onclick="start('match')"><span>🔗</span><strong>3. Picture Matching</strong></button>
  <button class="mode m4" onclick="start('drag')"><span>🧲</span><strong>4. Drag & Drop</strong></button>
  <button class="mode m5" onclick="start('builder')"><span>🔠</span><strong>5. Word Builder</strong></button>
  <button class="mode m6" onclick="start('trace')"><span>✏️</span><strong>6. Draw & Trace</strong></button>
  <button class="mode m7" onclick="start('color')"><span>🎨</span><strong>7. Color & Create</strong></button>
  <button class="mode m8" onclick="start('memory')"><span>🧠</span><strong>8. Memory Challenge</strong></button>
  <button class="mode m9" onclick="start('quiz')"><span>🏆</span><strong>9. Brain Quiz</strong></button>
  <button class="mode m10" onclick="start('treasure')"><span>💎</span><strong>10. Treasure Adventure</strong></button>
 </div>

 <div class="panel">
  <h2>📚 Word Categories</h2>
  <div class="grid" id="categories"></div>
 </div>
</section>

<section id="game" class="hidden">
 <button class="back" onclick="goHome()">← BACK</button>
 <div class="progress"><div id="progress"></div></div>
 <div class="small" id="modeTitle"></div>
 <div id="playArea"></div>
</section>

</main>

<!-- CORRECT ANSWER: TEN LANGUAGE DISPLAY -->

<div class="modal hidden" id="meaningModal">
 <div class="modalbox">
  <div class="success">🎉 EXCELLENT! CORRECT!</div>
  <div class="modalword" id="modalWord"></div>
  <p class="small">এই শব্দটির অর্থ ১০টি ভাষায়:</p>
  <div class="language-list" id="meaningList"></div>
  <div style="text-align:center;margin-top:12px">
   <button class="action" onclick="closeMeaning()">NEXT ➜</button>
  </div>
 </div>
</div>

<script>

// ===================================
// 1. WORD DATABASE - FIXED
// ===================================

let words = [];
let activeCategory = "All";

let usedWordsByCategory = {};

async function loadWords() {
 const response = await fetch("./words.json");
  try {
    const response = await fetch("./words.json");

    if (!response.ok) {
      throw new Error("words.json file not found");
    }

    const data = await response.json();

    if (!Array.isArray(data) || data.length === 0) {
      throw new Error("Word database is empty");
    }

    words = data;

    console.log("Total words loaded:", words.length);

    document.getElementById("modeTitle").textContent =
      "✅ শব্দের ডেটা লোড হয়েছে!";

  } catch (error) {
    console.error("Word loading error:", error);

    alert(
      "শব্দের ফাইল লোড হয়নি। words.json ফাইলটি পরীক্ষা করুন।"
    );
  }
}

function getNextWord(category = activeCategory) {

  let available = words.filter(item => {
    const categoryMatch =
      category === "All" || item.category === category;

    const used = usedWordsByCategory[category] || [];

    return categoryMatch && !used.includes(item.id);
  });

  if (available.length === 0) {

    const categoryWords = words.filter(item =>
      category === "All" || item.category === category
    );

    if (categoryWords.length === 0) return null;

    usedWordsByCategory[category] = [];

    available = categoryWords;
  }

  const selected =
    available[Math.floor(Math.random() * available.length)];

  if (!usedWordsByCategory[category]) {
    usedWordsByCategory[category] = [];
  }

  usedWordsByCategory[category].push(selected.id);

  return selected;
}

const langs=[
 ["বাংলা","bn"],["English","word"],["हिन्दी","hi"],
 ["العربية","ar"],["Español","es"],["Français","fr"],
 ["اردو","ur"],["中文","zh"],["日本語","ja"],["Deutsch","de"]
];

let current=null;
let mode="explore";
let round=0;
let score=Number(localStorage.getItem("slk_stars")||0);
let selected=null;
let memoryOpen=[];
let memoryDone=[];
let builderAnswer=[];
let canvas,ctx,drawing=false;
let colorValue="#ff4c85";

document.getElementById("stars").textContent=score;

function shuffle(a){
 return [...a].sort(()=>Math.random()-.5);
}


// UNIQUE WORD SYSTEM
let usedWords = [];
let categoryUsedWords = {};

function randomWord(){

  let available = words.filter(
    w => !usedWords.includes(w.word)
  );

  if(available.length === 0){
    usedWords = [];
    available = [...words];
  }

  const chosen =
    available[Math.floor(Math.random()*available.length)];

  usedWords.push(chosen.word);

  return chosen;
}


function speak(text,lang){
 if(!("speechSynthesis" in window)){
  alert("এই ডিভাইসে ভয়েস সুবিধা পাওয়া যাচ্ছে না।");
  return;
 }
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 const codes={
 bn:"bn-BD",word:"en-US",hi:"hi-IN",ar:"ar-SA",
 es:"es-ES",fr:"fr-FR",ur:"ur-PK",zh:"zh-CN",
 ja:"ja-JP",de:"de-DE"
 };
 u.lang=codes[lang]||"en-US";
 u.rate=.82;
 speechSynthesis.speak(u);
}

function goHome(){
 document.getElementById("home").classList.remove("hidden");
 document.getElementById("game").classList.add("hidden");
 document.getElementById("meaningModal").classList.add("hidden");
 speechSynthesis?.cancel();
}

function start(m){
 mode=m;round=0;
 document.getElementById("home").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");
 const names={
 explore:"🌍 Explore & Learn",
 listen:"👂 Listen & Find",
 match:"🔗 Picture Matching",
 drag:"🧲 Drag & Drop",
 builder:"🔠 Word Builder",
 trace:"✏️ Draw & Trace",
 color:"🎨 Color & Create",
 memory:"🧠 Memory Challenge",
 quiz:"🏆 Brain Quiz",
 treasure:"💎 Treasure Adventure"
 };
 document.getElementById("modeTitle").textContent=names[m];
 if(m==="memory") setupMemory();
 else if(m==="trace") showTrace();
 else if(m==="color") showColor();
 else nextQuestion();
}

// ===================================
// 2. QUESTION SYSTEMS
// ===================================

function nextQuestion(){
 current=randomWord();
 selected=null;
 document.getElementById("progress").style.width=
 Math.min(round*10,100)+"%";

 if(mode==="explore") showExplore();
 if(mode==="listen") showListen();
 if(mode==="match") showMatch();
 if(mode==="drag") showDrag();
 if(mode==="builder") showBuilder();
 if(mode==="quiz"||mode==="treasure") showQuiz();
}

function showExplore(){
 document.getElementById("playArea").innerHTML=`
 <div class="question">ছবিটি দেখুন এবং শব্দটি শিখুন</div>
 <div class="picture" onclick="speak(current.word,'word')">${current.pic}</div>
 <div class="word" onclick="speak(current.word,'word')">${current.word}</div>
 <div class="small">শব্দে স্পর্শ করলে উচ্চারণ শুনতে পাবেন</div>
 <div class="answers">
 <button class="answer" onclick="speak(current.bn,'bn')">বাংলা: ${current.bn}</button>
 <button class="answer" onclick="speak(current.hi,'hi')">Hindi: ${current.hi}</button>
 </div>
 <div style="text-align:center">
 <button class="action" onclick="showMeaning(current)">🌐 ১০ ভাষায় অর্থ দেখুন</button>
 <button class="action secondary" onclick="nextQuestion()">NEXT WORD ➜</button>
 </div>`;
}

function showListen(){
 const options=shuffle([current,...shuffle(words.filter(w=>w!==current)).slice(0,3)]);
 document.getElementById("playArea").innerHTML=`
 <div class="question">শব্দটি শুনুন। সঠিক ছবি খুঁজুন!</div>
 <div style="text-align:center">
 <button class="action" onclick="speak(current.word,'word')">🔊 PLAY WORD</button>
 </div>
 <div class="answers">
 ${options.map(w=>`<button class="answer" onclick="check(w.word)"><span style="font-size:37px">${w.pic}</span><br>${w.bn}</button>`).join("")}
 </div>`;
}

function showMatch(){
 const options=shuffle([current,...shuffle(words.filter(w=>w!==current)).slice(0,3)]);
 document.getElementById("playArea").innerHTML=`
 <div class="question">ছবির সঙ্গে সঠিক শব্দ মেলান</div>
 <div class="picture">${current.pic}</div>
 <div class="answers">
 ${options.map(w=>`<button class="answer" onclick="check(w.word)">${w.word}</button>`).join("")}
 </div>`;
}

function showDrag(){
 const options=shuffle([current,...shuffle(words.filter(w=>w!==current)).slice(0,3)]);
 document.getElementById("playArea").innerHTML=`
 <div class="question">সঠিক অর্থটি টেনে ছবির ঘরে রাখুন</div>
 <div class="picture" id="dropZone" ondragover="event.preventDefault()" ondrop="dropAnswer(event)">${current.pic}<br><small>এখানে ছাড়ুন</small></div>
 ${options.map(w=>`<div class="drag-option" draggable="true" ondragstart="dragAnswer(event,'${w.word}')">${w.bn}</div>`).join("")}
 <p class="small">মোবাইলে টাচ করে উত্তর বাছাই করতে নিচের বাটনও ব্যবহার করতে পারবেন।</p>
 <div class="answers">
 ${options.map(w=>`<button class="answer" onclick="check('${w.word}')">${w.bn}</button>`).join("")}
 </div>`;
}

function dragAnswer(e,w){
 e.dataTransfer.setData("answer",w);
}
function dropAnswer(e){
 e.preventDefault();
 check(e.dataTransfer.getData("answer"));
}

function showBuilder(){
 const letters=shuffle(current.word.toUpperCase().split(""));
 builderAnswer=[];
 document.getElementById("playArea").innerHTML=`
 <div class="question">অক্ষর সাজিয়ে শব্দ তৈরি করুন</div>
 <div class="picture">${current.pic}</div>
 <div class="word" id="builtWord">_ _ _ _</div>
 <div class="answers">
 ${letters.map((l,i)=>`<button class="answer" onclick="addLetter('${l}',${i})">${l}</button>`).join("")}
 </div>
 <div style="text-align:center">
 <button class="action" onclick="checkBuilder()">CHECK WORD</button>
 <button class="action secondary" onclick="nextQuestion()">SKIP</button>
 </div>`;
}

function addLetter(l,i){
 builderAnswer.push(l);
 document.getElementById("builtWord").textContent=builderAnswer.join("");
}
function checkBuilder(){
 if(builderAnswer.join("")===current.word.toUpperCase()) correct();
 else alert("আবার চেষ্টা করো! 😊");
}

function showQuiz(){
 const options=shuffle([current,...shuffle(words.filter(w=>w!==current)).slice(0,3)]);
 const title=mode==="treasure"?"💎 Treasure Question":"🧠 সঠিক অর্থটি নির্বাচন করুন";
 document.getElementById("playArea").innerHTML=`
 <div class="question">${title}</div>
 <div class="picture">${current.pic}</div>
 <div class="word">${current.word}</div>
 <div class="answers">
 ${options.map(w=>`<button class="answer" onclick="check('${w.word}')">${w.bn}</button>`).join("")}
 </div>`;
}

function check(answer){
 if(answer===current.word) correct();
 else{
  showMessage("আবার চেষ্টা করো! 🌟");
 }
}

function showMessage(msg){
 const old=document.getElementById("feedback");
 if(old)old.remove();
 const d=document.createElement("div");
 d.id="feedback";d.className="small";
 d.style.color="#e34b55";d.style.fontWeight="bold";
 d.textContent=msg;
 document.getElementById("playArea").appendChild(d);
}

// ===================================
// 3. TEN LANGUAGE FLOATING DISPLAY
// ===================================

function correct(){
 score+=5;
 localStorage.setItem("slk_stars",score);
 document.getElementById("stars").textContent=score;
 round++;
 showMeaning(current);
}

function showMeaning(w){
 document.getElementById("modalWord").textContent=w.pic+" "+w.word;
 document.getElementById("meaningList").innerHTML=langs.map(([name,key])=>{
  const value=w[key];
  return `<button class="language-item" onclick="speak('${escapeText(value)}','${key}')">
   <b>${name} 🔊</b><span>${value}</span>
  </button>`;
 }).join("");
 document.getElementById("meaningModal").classList.remove("hidden");
}

function escapeText(s){
 return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}

function closeMeaning(){
 document.getElementById("meaningModal").classList.add("hidden");
 if(mode==="memory") setupMemory();
 else if(mode==="trace"||mode==="color") goHome();
 else nextQuestion();
}

// ===================================
// 4. DRAW & TRACE
// ===================================

function showTrace(){
 current=randomWord();
 document.getElementById("playArea").innerHTML=`
 <div class="question">✏️ শব্দটি দেখে লিখে অনুশীলন করো</div>
 <div class="picture">${current.pic}</div>
 <div class="word">${current.word}</div>
 <canvas id="drawCanvas" class="canvas"></canvas>
 <div style="text-align:center">
 <button class="action secondary" onclick="clearCanvas()">CLEAR</button>
 <button class="action" onclick="finishCreative()">DONE ⭐</button>
 </div>`;
 setupCanvas();
}

function setupCanvas(){
 canvas=document.getElementById("drawCanvas");
 ctx=canvas.getContext("2d");
 const r=canvas.getBoundingClientRect();
 canvas.width=r.width*devicePixelRatio;
 canvas.height=r.height*devicePixelRatio;
 ctx.scale(devicePixelRatio,devicePixelRatio);
 ctx.lineWidth=5;ctx.lineCap="round";ctx.strokeStyle="#7138d9";
 canvas.onpointerdown=e=>{
  drawing=true;const r=canvas.getBoundingClientRect();
  ctx.beginPath();ctx.moveTo(e.clientX-r.left,e.clientY-r.top);
 };
 canvas.onpointermove=e=>{
  if(!drawing)return;
  const r=canvas.getBoundingClientRect();
  ctx.lineTo(e.clientX-r.left,e.clientY-r.top);ctx.stroke();
 };
 canvas.onpointerup=()=>drawing=false;
 canvas.onpointerleave=()=>drawing=false;
}
function clearCanvas(){
 if(ctx)ctx.clearRect(0,0,canvas.width,canvas.height);
}
function finishCreative(){
 score+=2;localStorage.setItem("slk_stars",score);
 document.getElementById("stars").textContent=score;
 showMeaning(current);
}

// ===================================
// 5. COLOR & CREATE
// ===================================

function showColor(){
 current=randomWord();
 document.getElementById("playArea").innerHTML=`
 <div class="question">🎨 নিজের মতো রং করো!</div>
 <div class="picture" id="colorPicture">${current.pic}</div>
 <div class="word">${current.word}</div>
 <div class="colors">
 ${["#ff4c85","#ffb52e","#36c9ff","#42ce78","#9a62ec","#222222"].map(c=>`<button class="color" style="background:${c}" onclick="setColor('${c}')"></button>`).join("")}
 </div>
 <div class="small">রং নির্বাচন করে ছবির ওপর স্পর্শ করো।</div>
 <div style="text-align:center">
 <button class="action" onclick="finishCreative()">FINISH ⭐</button>
 </div>`;
}
function setColor(c){
 colorValue=c;
 document.getElementById("colorPicture").style.background=c;
}

// ===================================
// 6. MEMORY CHALLENGE
// ===================================

function setupMemory(){
 const selectedWords=shuffle(words).slice(0,4);
 const cards=shuffle(selectedWords.flatMap((w,i)=>[
  {id:i,value:w.pic,word:w.word},
  {id:i,value:w.bn,word:w.word}
 ]));
 memoryOpen=[];memoryDone=[];
 document.getElementById("playArea").innerHTML=`
 <div class="question">একই ছবি ও অর্থের জোড়া খুঁজে বের করো</div>
 <div class="memory-grid" id="memoryGrid">
 ${cards.map((c,i)=>`<button class="memory-card" id="mem${i}" onclick="flipMemory(${i},${c.id},'${c.word}')">❓</button>`).join("")}
 </div>
 <div class="small">সবগুলো জোড়া মিলিয়ে ১০ ভাষার অর্থ শিখবে।</div>`;
 window.memoryCards=cards;

function flipMemory(index,id,word){
 if(memoryDone.includes(id)||memoryOpen.some(x=>x.index===index)||memoryOpen.length>=2)return;
 document.getElementById("mem"+index).textContent=window.memoryCards[index].value;
 document.getElementById("mem"+index).classList.add("open");
 memoryOpen.push({index,id,word});
 if(memoryOpen.length===2){
  if(memoryOpen[0].id===memoryOpen[1].id){
   const found=memoryOpen[0].word;
   memoryDone.push(id);memoryOpen=[];
   setTimeout(()=>{
    const w=words.find(x=>x.word===found);
    score+=5;localStorage.setItem("slk_stars",score);
    document.getElementById("stars").textContent=score;
    if(memoryDone.length===4){
     current=w;showMeaning(w);
    }
   },300);
  }else{
   setTimeout(()=>{
    memoryOpen.forEach(x=>{
     document.getElementById("mem"+x.index).textContent="❓";
     document.getElementById("mem"+x.index).classList.remove("open");
    });
    memoryOpen=[];
   },850);
  }
 }
}
