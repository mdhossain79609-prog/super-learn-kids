<style>
*{

 padding:0;

html,body{

 height:100%;

 font-family:Arial,"Trebuchet MS",sans-serif;

body{

}

button{

}

.screen{
 width:100%;
 height:100%;
 height:100dvh;

 overflow:hidden;
 padding:9px 11px;
}

.screen.active{

}

/* TOP BAR */

.topbar{
 height:43px;

 display:flex;
 justify-content:space-between;
 align-items:center;
}

.topgroup{
 display:flex;
 align-items:center;

}

.settings{

 height:38px;

 font-size:19px;
 box-shadow:0 3px 0 #70a8d7;
}

.language,.score{
 background:#0861bd;
 color:white;
 padding:9px 10px;
 border-radius:25px;
 font-weight:bold;
 font-size:12px;
}

.trophy{
 font-size:23px;
}

/* HOME */

#homeScreen{
 justify-content:space-between;
}

.hero{
 text-align:center;
 flex-shrink:1;
 min-height:0;
}

.logo{
 font-size:clamp(34px,9vw,51px);
 font-weight:1000;
 line-height:.88;
 letter-spacing:-2px;
 color:white;
 text-shadow:3px 4px 0 #07529c;
}

.logo span{
 display:block;
 color:#ffdc20;
}

.tagline{
 display:inline-block;
 margin-top:9px;
 background:#8134dc;
 color:white;
 padding:8px 17px;
 border-radius:30px;
 font-size:13px;
 font-weight:bold;
 box-shadow:0 4px 0 #501ca2;
}

.book-area{

 margin:9px 0;
 border:4px solid white;
 border-radius:45px;
 background:linear-gradient(145deg,#67e5ff,#b7f5ff);
 box-shadow:0 0 16px white,0 5px 0 #6ab4e6;
 display:flex;
 justify-content:center;
 align-items:center;
}

.book{
 font-size:clamp(75px,19vw,125px);
 filter:drop-shadow(0 7px 4px #07529c55);
 animation:float 3s ease-in-out infinite;
}

@keyframes float{
 50%{transform:translateY(-7px)}
}

.welcome{
 font-size:clamp(16px,4vw,21px);
 font-weight:bold;
 margin:7px 0 11px;
}

.start{
 width:94%;
 padding:13px 5px;
 border:4px solid white;
 border-radius:45px;
 background:linear-gradient(#fff000,#ffad00);
 color:#08418d;
 font-size:clamp(19px,5vw,25px);
 font-weight:1000;
 box-shadow:0 5px 0 #d87900;
}

.start:active{
 transform:translateY(4px);
}

.bottom-menu{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 background:#ffffffed;
 border-radius:19px;
 padding:9px 2px;
 flex-shrink:0;
}

.bottom-menu button{
 background:transparent;
 color:#123c80;
 font-size:10px;
 font-weight:bold;

 flex-direction:column;
 align-items:center;

.bottom-menu button:last-child{

.bottom-menu span{

#categoryScreen{

}

.back{

 color:#07509b;
 padding:9px 15px;
 border-radius:25px;
 font-weight:bold;
 flex-shrink:0;

 overflow-y:auto;

.learn-btn{

.learn-icon{

<script>

/* SCREEN CONTROL */

function openCategories(){
 document.getElementById("homeScreen").classList.remove("active");
 document.getElementById("categoryScreen").classList.add("active");
}

function goHome(){
 document.getElementById("categoryScreen").classList.remove("active");
 document.getElementById("homeScreen").classList.add("active");
}

/* MESSAGE */

let messageTimer;

function showMessage(text){
 const box=document.getElementById("message");
 box.textContent=text;
 box.style.display="block";

 clearTimeout(messageTimer);

 messageTimer=setTimeout(()=>{
  box.style.display="none";
 },2500);
}

/* CATEGORY FILE CONNECTION */

function openSubject(name){

 const pages={

  "Arabic Alphabet":"arabic.html",
  "ABC Alphabet":"alphabet.html",
  "ABC Mix":"alphabet-abc.html",
  "Typing":"typing.html",

  "অ আ ই":"bangla-swarabarna.html",
  "ক খ গ":"bangla-byangjanbarna.html",
  "বাংলা স্বরচিহ্ন":"bangla-kar.html",
  "বানান শিক্ষা":"spelling.html",

  "বাংলা সংখ্যা":"bangla-numbers.html",
  "English Numbers":"english-numbers.html",
  "নামতা":"namta.html",
  "যোগ বিয়োগ":"addition-subtraction.html",
  "Calculator":"calculator.html",

  "৭ দিনের নাম":"7-days.html",
  "ঋতুর নাম":"seasons.html",
  "বাংলা ১২ মাস":"bangla-12-months.html",
  "English 12 Months":"english-12-months.html",
  "Arabic 12 Months":"arabic-12-months.html",

  "মানব দেহ":"human-body.html",
  "সম্পর্কের নাম":"relationships.html",
  "পেশার নাম":"professions.html",

  "ফলের নাম":"fruits.html",
  "ফুলের নাম":"flowers.html",
  "শাকসবজির নাম":"vegetables.html",
  "পশুর নাম":"animals.html",
  "পাখির নাম":"birds.html",
  "হিংস্র প্রাণী":"wild-animals.html",
  "মাছের নাম":"fish.html",

  "যানবাহনের নাম":"vehicles.html",
  "রঙের নাম":"colors.html",
  "রং করি":"drawing-coloring.html",
  "ছবি আঁকি":"free-drawing.html",
  "আকার আকৃতি":"shapes.html",
  "আসবাবপত্র":"furniture.html",

  "প্রাকৃতিক স্থান":"natural-places.html",
  "দিকনির্দেশনা":"directions.html",
  "জাতীয় বিষয়":"national-topics.html",
  "মহাসাগর":"oceans.html",
  "মহাদেশ":"continents.html",
  "দেশের নাম":"countries.html",
  "বিশ্বের টুকিটাকি":"world-facts.html",

  "শিক্ষণীয় প্রশ্ন":"educational-quiz.html",
  "শিক্ষণীয় গল্প":"stories.html",
  "বাংলা ছড়া":"bangla-rhymes.html",
  "English Rhymes":"english-rhymes.html",
  "Computer Technology":"computer-technology.html"

/* LANGUAGE */

function saveGlobalLanguage(language){
 try{
  localStorage.setItem("slk_language",language);
 }catch(e){}
}

/* LOAD SAVED DATA */

function loadGlobalData(){

 let stars="0";
 let language="en";

 try{
  stars=localStorage.getItem("slk_stars")||"0";
  language=localStorage.getItem("slk_language")||"en";
 }catch(e){}

 document.getElementById("globalStars").textContent=stars;
 document.getElementById("categoryStars").textContent=stars;

 document.getElementById("globalLanguage").value=language;
}

loadGlobalData();

</script>
