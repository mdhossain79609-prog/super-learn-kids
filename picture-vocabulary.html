}

}

.category:active{

}

.category .emoji{
  font-size:42px;
  filter:drop-shadow(2px 4px 2px #5557);
}

.category span:last-child{

  font-weight:bold;

}

</div>

</div>

<div class="footer">

// ==================================

function renderCategories(){

 const grid=$("categoryGrid");
 grid.innerHTML="";

 Object.keys(vocabulary).forEach((name,i)=>{

   const data=vocabulary[name];

   const btn=document.createElement("button");

   btn.className="category "+data.color;

   btn.innerHTML=`
     <span class="emoji">${data.icon}</span>
     <span>${name}</span>
     <span>${data.words.length} Words</span>
   `;

   btn.onclick=()=>openCategory(name);

   grid.appendChild(btn);

 });

}

function searchItems(){

 const value=$("search").value.toLowerCase();

 document.querySelectorAll(".category").forEach((btn,i)=>{

   const name=Object.keys(vocabulary)[i];

   const matches=name.toLowerCase().includes(value) ||
     vocabulary[name].words.some(w=>
       w[1].toLowerCase().includes(value) ||
       w[2].includes(value)
     );

   btn.style.display=matches?"flex":"none";

 });

}

// ==================================
// OPEN CATEGORY
// ==================================

function openCategory(name){

 currentCategory=name;
 currentWords=vocabulary[name].words;
 currentIndex=0;

 $("categoryScreen").classList.add("hide");
 $("lesson").style.display="block";
 $("playGame").style.display="block";
 $("gameArea").style.display="none";

 showWord();

 window.scrollTo({top:0,behavior:"smooth"});

}

// ==================================
// SHOW WORD
// ==================================

function showWord(){

 const word=currentWords[currentIndex];

 $("categoryName").innerText=
   vocabulary[currentCategory].icon+" "+currentCategory;

 $("picture").innerText=word[0];
 $("englishWord").innerText=word[1];
 $("banglaMeaning").innerText=word[2];

 $("pronunciation").innerText=
   "বাংলা উচ্চারণ: "+word[3];

 $("progressText").innerText=
   (currentIndex+1)+" / "+currentWords.length;

 $("progressFill").style.width=
   ((currentIndex+1)/currentWords.length*100)+"%";

}

// ==================================
// NEXT / BACK
// ==================================

function nextWord(){

 if(currentIndex<currentWords.length-1){
   currentIndex++;
 }else{
   currentIndex=0;
 }

 showWord();
}

function previousWord(){

 if(currentIndex>0){
   currentIndex--;
 }else{
   currentIndex=currentWords.length-1;
 }

 showWord();
}

// ==================================
// SPEECH SYSTEM
// ==================================

function speak(text,lang){

 if(!("speechSynthesis" in window)){
   alert("Your browser does not support voice.");
   return;
 }

 window.speechSynthesis.cancel();

 const speech=new SpeechSynthesisUtterance(text);

 speech.lang=lang;
 speech.rate=0.8;
 speech.pitch=1.15;
 speech.volume=1;

 window.speechSynthesis.speak(speech);

}

function speakEnglish(){

 const word=currentWords[currentIndex];

 speak(word[1],"en-US");

}

function speakBangla(){

 const word=currentWords[currentIndex];

 speak(word[2],"bn-BD");

}

// ==================================
// STAR REWARD
// ==================================

function addStar(){

 stars+=1;

 $("stars").innerText=stars;

}

// ==================================
// GAME SYSTEM
// ==================================

function startGame(){

 $("lesson").style.display="none";
 $("playGame").style.display="none";
 $("gameArea").style.display="block";

 newQuestion();

 window.scrollTo({top:0,behavior:"smooth"});

}

function closeGame(){

 $("gameArea").style.display="none";
 $("lesson").style.display="block";
 $("playGame").style.display="block";

}

function newQuestion(){

 const allWords=[];

 Object.keys(vocabulary).forEach(category=>{
   vocabulary[category].words.forEach(word=>{
     allWords.push(word);
   });
 });

 gameAnswer=allWords[
   Math.floor(Math.random()*allWords.length)
 ];

 $("gamePicture").innerText=gameAnswer[0];

 $("gameMessage").innerText="";

 let options=[gameAnswer];

 while(options.length<4){

   const random=allWords[
     Math.floor(Math.random()*allWords.length)
   ];

   if(!options.includes(random)){
     options.push(random);
   }

 }

 options.sort(()=>Math.random()-.5);

 const grid=$("answerGrid");

 grid.innerHTML="";

 options.forEach(option=>{

   const btn=document.createElement("button");

   btn.className="answer-btn";
   btn.innerText=option[1];

   btn.onclick=()=>checkAnswer(option,btn);

   grid.appendChild(btn);

 });

}

function checkAnswer(option,button){

 if(!gameAnswer)return;

 const buttons=document.querySelectorAll(".answer-btn");

 buttons.forEach(btn=>btn.disabled=true);

 if(option===gameAnswer){

   $("gameMessage").innerText="🎉 CORRECT! WELL DONE! +5 ⭐";

   stars+=5;
   $("stars").innerText=stars;

   button.style.background=
     "linear-gradient(135deg,#00e66b,#00943c)";

 }else{

   $("gameMessage").innerText=
     "❌ TRY AGAIN! Correct: "+gameAnswer[1];

   button.style.background="#ed3838";

 }

 gameAnswer=null;

}

// ==================================
// HOME & SETTINGS
// ==================================

function goHome(){

 if(window.history.length>1){
   window.history.back();
 }else{
   window.location.href="index.html";
 }

}

function showSettings(){

 alert(
  "PICTURE VOCABULARY SETTINGS\n\n"+
  "English Voice: en-US\n"+
  "Bangla Voice: bn-BD\n"+
  "Learning Mode: ON\n"+
  "Game Mode: ON"
 );

}

// INITIALIZE
// ==================================

renderCategories();
